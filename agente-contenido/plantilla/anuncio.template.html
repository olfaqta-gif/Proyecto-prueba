<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anuncio Farmasi</title>
<style>/*FUENTES*/</style>
<style>
  /* Paletas: la ficha elige una con "paleta". fondo = oscuro, acento = color de la marca, brillo = detalles */
  :root, [data-paleta="coral"]{--fondo:#24081f;--fondo2:#7b1f6b;--acento:#ee5d6c;--acento2:#ff8a7a;--brillo:#f2c27b;--crema:#fff5ef}
  [data-paleta="dorado"]{--fondo:#1d1206;--fondo2:#6b4a12;--acento:#e0a43a;--acento2:#ffd27a;--brillo:#fff0c2;--crema:#fffaf0}
  [data-paleta="verde"]{--fondo:#06201a;--fondo2:#155e4b;--acento:#3fbf8f;--acento2:#8de0bf;--brillo:#e6f5a8;--crema:#f2fff9}
  [data-paleta="lavanda"]{--fondo:#150d2b;--fondo2:#4d2f8a;--acento:#a77bf3;--acento2:#d3b8ff;--brillo:#ffd6f0;--crema:#faf6ff}
  [data-paleta="rosa"]{--fondo:#2a0717;--fondo2:#8a1f4f;--acento:#ff5fa2;--acento2:#ffa3c8;--brillo:#ffe08a;--crema:#fff4f8}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0710;overflow:hidden}
  body{display:grid;place-items:center;font-family:Montserrat,system-ui,sans-serif}
  #stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--fondo);
    transform-origin:center center;flex:none;color:var(--crema)}
  .abs{position:absolute;inset:0}
  .serif{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:800}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px}

  /* ---------- fondo ---------- */
  .blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55}
  .b1{width:900px;height:900px;background:var(--acento);left:-300px;top:-200px;animation:drift1 14s ease-in-out infinite alternate}
  .b2{width:800px;height:800px;background:var(--fondo2);right:-320px;bottom:-160px;animation:drift2 11s ease-in-out infinite alternate}
  .b3{width:520px;height:520px;background:var(--brillo);left:300px;top:900px;opacity:.2;animation:drift1 9s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(260px,380px) scale(1.2)}}
  @keyframes drift2{to{transform:translate(-280px,-420px) scale(1.15)}}
  .grain{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");opacity:.09;mix-blend-mode:overlay;pointer-events:none}
  .spark{position:absolute;border-radius:50%;background:var(--brillo);box-shadow:0 0 14px 4px color-mix(in srgb,var(--brillo) 60%,transparent);
    animation:float var(--dur) linear infinite;animation-delay:var(--dl)}
  @keyframes float{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translateY(-900px) scale(1);opacity:0}}
  .colorbg{background:linear-gradient(160deg,var(--acento2) 0%,var(--acento) 45%,var(--fondo2) 100%)}

  /* ---------- escenas: el contenedor externo maneja la salida, el interno la entrada ---------- */
  .out{animation:fadeOut .45s ease-in var(--out) both}
  .in {animation:fadeIn .35s ease-out var(--in) both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0;transform:scale(1.06);filter:blur(8px)}}
  .rise{animation:rise .8s cubic-bezier(.2,.9,.25,1.15) var(--d) both}
  @keyframes rise{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
  .stamp{animation:stamp .7s cubic-bezier(.2,1.4,.4,1) var(--d) both}
  @keyframes stamp{from{opacity:0;transform:scale(2.6);filter:blur(18px)}to{opacity:1;transform:none;filter:none}}
  .pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) var(--d) both}
  @keyframes pop{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:none}}
  .flash{background:#fff;animation:flash .5s ease-out var(--d) both;pointer-events:none}
  @keyframes flash{0%{opacity:0}15%{opacity:.8}100%{opacity:0}}
  .float{animation:bob 2.2s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-22px)}}

  .kicker{font-size:34px;font-weight:700;letter-spacing:10px;text-transform:uppercase;color:var(--brillo)}

  /* ---------- 1 gancho ---------- */
  .gancho .l{font-weight:900;font-size:104px;line-height:1.06;letter-spacing:-3px;max-width:900px}
  .gancho .l2{margin-top:24px;color:var(--brillo);font-size:112px}
  .gancho .kicker{margin-bottom:60px}

  /* ---------- 2 producto ---------- */
  .prod{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .halo{width:780px;height:780px;border-radius:50%;display:grid;place-items:center;background:#fff;
    box-shadow:0 0 0 18px rgba(255,255,255,.18),0 0 0 44px rgba(255,255,255,.07),0 0 220px 60px color-mix(in srgb,var(--acento) 55%,transparent)}
  .halo img{max-width:560px;max-height:560px;object-fit:contain;display:block}
  .tag{margin-top:90px;text-align:center;padding:0 80px}
  .tag small{display:block;font-size:36px;font-weight:700;color:var(--brillo);letter-spacing:6px;text-transform:uppercase;margin-bottom:14px}
  .tag .nombre{font-weight:800;font-size:76px;line-height:1.05;letter-spacing:-1px}
  .pill{margin-top:34px;display:inline-flex;align-items:center;gap:16px;background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.25);padding:16px 34px;border-radius:60px;font-size:40px;font-weight:700}
  .pill b{color:var(--brillo);letter-spacing:4px}

  /* ---------- 3 beneficios ---------- */
  .ben .head{position:absolute;top:210px;left:0;right:0;text-align:center;padding:0 80px}
  .ben h2{font-family:"Playfair Display",serif;font-style:italic;font-weight:800;font-size:84px;line-height:1.08;color:var(--fondo);margin-top:20px}
  .ben .kicker{color:var(--fondo)}
  .ben .lista{position:absolute;top:640px;left:90px;right:90px;display:flex;flex-direction:column;gap:46px}
  .ben .row{display:flex;align-items:center;gap:40px;background:rgba(255,255,255,.92);color:var(--fondo);border-radius:44px;
    padding:38px 48px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .ben .ico{width:110px;height:110px;border-radius:32px;background:var(--fondo);display:grid;place-items:center;flex:none}
  .ben .ico svg{width:60px;height:60px;stroke:var(--brillo);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .ben .txt{font-weight:800;font-size:58px;line-height:1.08;letter-spacing:-1px}
  .ben .mini-prod{position:absolute;bottom:150px;left:50%;margin-left:-130px;width:260px;height:260px;border-radius:50%;background:#fff;
    display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .ben .mini-prod img{max-width:180px;max-height:190px;object-fit:contain}

  /* ---------- 4 cierre ---------- */
  .cierre .marca{font-weight:500;font-size:84px;letter-spacing:34px;margin-right:-34px}
  .cierre .mini{width:340px;height:340px;border-radius:50%;background:#fff;margin-top:70px;display:grid;place-items:center;
    box-shadow:0 0 0 14px rgba(255,255,255,.15),0 30px 80px rgba(0,0,0,.35)}
  .cierre .mini img{max-width:240px;max-height:250px;object-fit:contain}
  .cierre .frase{font-size:92px;font-weight:900;line-height:1.02;letter-spacing:-3px;margin-top:70px}
  .cierre .frase .serif{display:block;color:var(--brillo);font-size:100px;margin-top:10px}
  .cierre .precio{margin-top:40px;font-size:48px;font-weight:700}
  .cierre .precio b{color:var(--brillo)}
  .btn{margin-top:70px;background:#fff;color:var(--acento);font-weight:900;font-size:56px;padding:42px 80px;border-radius:100px;white-space:nowrap;
    box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pulse 1.1s ease-in-out infinite alternate}
  @keyframes pulse{to{transform:scale(1.06);box-shadow:0 20px 90px rgba(255,255,255,.45)}}
  .btn span{color:var(--fondo)}
  .usuario{margin-top:40px;font-size:40px;font-weight:700}
  .aviso{position:absolute;bottom:70px;left:80px;right:80px;text-align:center;font-size:24px;line-height:1.4;color:color-mix(in srgb,var(--crema) 70%,transparent)}
</style>
</head>
<body>
<div id="stage">
  <div class="abs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="abs out" data-out="beneficios.sale"><div class="abs colorbg in" data-in="beneficios.entra"></div></div>
  <div class="abs" id="sparks"></div>

  <!-- 1 · gancho -->
  <div class="abs out" data-out="gancho.sale"><div class="abs center gancho in" data-in="gancho.entra">
    <div class="kicker rise" data-d="gancho.kicker" data-txt="gancho.kicker"></div>
    <div class="l rise fit" data-d="gancho.linea1" data-txt="gancho.linea1"></div>
    <div class="l l2 serif rise fit" data-d="gancho.linea2" data-txt="gancho.linea2"></div>
  </div></div>
  <div class="abs flash" data-d="flash"></div>

  <!-- 2 · producto -->
  <div class="abs out" data-out="producto.sale"><div class="abs in" data-in="producto.entra">
    <div class="prod">
      <div class="halo pop" data-d="producto.halo"><img class="float" data-img alt=""></div>
      <div class="tag">
        <small class="rise" data-d="producto.categoria" data-txt="producto.categoria"></small>
        <div class="nombre rise fit" data-d="producto.nombre" data-txt="producto.nombre"></div>
        <div class="rise" data-d="producto.dato" data-si="producto.dato"><div class="pill"><b data-txt="producto.dato.destacado"></b><span data-txt="producto.dato.texto"></span></div></div>
      </div>
    </div>
  </div></div>

  <!-- 3 · beneficios -->
  <div class="abs out" data-out="beneficios.sale"><div class="abs ben in" data-in="beneficios.entra">
    <div class="head">
      <div class="kicker rise" data-d="beneficios.titulo" data-txt="producto.nombre_corto"></div>
      <h2 class="rise fit" data-d="beneficios.titulo" data-txt="beneficios.titulo"></h2>
    </div>
    <div class="lista">
      <div class="row pop" data-d="beneficios.b1" data-si="beneficios.lista.0"><div class="ico"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="txt fit" data-txt="beneficios.lista.0"></div></div>
      <div class="row pop" data-d="beneficios.b2" data-si="beneficios.lista.1"><div class="ico"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="txt fit" data-txt="beneficios.lista.1"></div></div>
      <div class="row pop" data-d="beneficios.b3" data-si="beneficios.lista.2"><div class="ico"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="txt fit" data-txt="beneficios.lista.2"></div></div>
    </div>
    <div class="mini-prod pop" data-d="beneficios.b3"><img data-img alt=""></div>
  </div></div>

  <!-- 4 · cierre -->
  <div class="abs center cierre in" data-in="cierre.entra">
    <div class="marca stamp" data-d="cierre.marca">FARMASi</div>
    <div class="mini pop" data-d="cierre.mini"><img class="float" data-img alt=""></div>
    <div class="frase rise fit" data-d="cierre.frase"><span data-txt="cierre.frase1"></span><span class="serif" data-txt="cierre.frase2"></span></div>
    <div class="precio rise" data-d="cierre.precio" data-si="cierre.precio" data-txt="cierre.precio"></div>
    <div class="rise" data-d="cierre.boton"><div class="btn"><span data-txt="cierre.boton_pre"></span> “<b data-txt="cierre.palabra"></b>” 💬</div></div>
    <div class="usuario rise" data-d="cierre.boton" data-si="cierre.usuario" data-txt="cierre.usuario"></div>
    <div class="aviso rise" data-d="cierre.aviso" data-txt="cierre.aviso"></div>
  </div>

  <div class="abs grain"></div>
</div>

<script>
  const T = /*TIEMPOS*/;
  const F = /*FICHA*/;
  const IMG = "/*IMAGEN*/";
  const get = (o, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), o);

  document.documentElement.dataset.paleta = F.paleta || 'coral';
  // Textos de la ficha (textContent: nunca se interpreta HTML de la ficha)
  document.querySelectorAll('[data-txt]').forEach(el => { el.textContent = get(F, el.dataset.txt) ?? ''; });
  // Bloques opcionales: si la ficha no trae el dato, el bloque no aparece
  document.querySelectorAll('[data-si]').forEach(el => { if (!get(F, el.dataset.si)) el.remove(); });
  document.querySelectorAll('[data-img]').forEach(el => { el.src = IMG; });
  // Tiempos: un solo archivo (tiempos.json) mueve video y sonido a la vez
  const sec = k => get(T, k) + 's';
  document.querySelectorAll('[data-d]').forEach(el => el.style.setProperty('--d', sec(el.dataset.d)));
  document.querySelectorAll('[data-in]').forEach(el => el.style.setProperty('--in', sec(el.dataset.in)));
  document.querySelectorAll('[data-out]').forEach(el => el.style.setProperty('--out', sec(el.dataset.out)));

  const sparks = document.getElementById('sparks');
  for (let i = 0; i < 38; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const r = n => (Math.sin(i * 99.13 + n) + 1) / 2;   // determinista: mismo video en cada render
    s.style.left = (r(1) * 1080) + 'px';
    s.style.top = (900 + r(2) * 1100) + 'px';
    s.style.setProperty('--dur', (5 + r(3) * 6).toFixed(2) + 's');
    s.style.setProperty('--dl', (-r(4) * 10).toFixed(2) + 's');
    s.style.width = s.style.height = (8 * (0.4 + r(5) * 1.2)) + 'px';
    sparks.appendChild(s);
  }

  // Textos largos: reduce la letra hasta que quepan (máx. 3 líneas en títulos)
  window.__ajustar = () => {
    document.querySelectorAll('.fit').forEach(el => {
      const lh = parseFloat(getComputedStyle(el).lineHeight) || parseFloat(getComputedStyle(el).fontSize) * 1.1;
      let size = parseFloat(getComputedStyle(el).fontSize);
      const maxH = lh * (el.classList.contains('txt') ? 2.2 : 3.2);
      while ((el.scrollHeight > maxH || el.scrollWidth > el.clientWidth + 2) && size > 30) {
        size -= 2; el.style.fontSize = size + 'px';
        el.querySelectorAll('.serif').forEach(s => s.style.fontSize = (size * 1.08) + 'px');
      }
    });
    // Botón: una sola línea aunque la palabra clave sea larga
    document.querySelectorAll('.btn').forEach(el => {
      let size = 56;
      while (el.offsetWidth > 900 && size > 30) { size -= 2; el.style.fontSize = size + 'px'; el.style.paddingInline = '56px'; }
    });
  };
  document.fonts.ready.then(window.__ajustar);

  const stage = document.getElementById('stage');
  function fit(){ const k = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `scale(${k})`; }
  addEventListener('resize', fit); fit();
  // Un solo reloj para todas las animaciones CSS: permite exportar cuadro por cuadro
  window.__seek = t => document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
  if (!location.search.includes('render')) {
    const t0 = performance.now();
    (function tick(){ window.__seek(((performance.now() - t0) / 1000) % T.duracion); requestAnimationFrame(tick); })();
  }
</script>
</body>
</html>
