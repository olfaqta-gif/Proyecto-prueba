<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina de Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Concepto: la oficina de Jarvis de noche. Al centro, una oficina limpia en tonos azules
     con ventanal a la ciudad: cada agente es un robot en su escritorio y, cuando Jarvis lo
     llama, flota hasta la mesa de reuniones bajo el holograma de Jarvis. A los lados,
     paneles de vidrio azul: la conversación y el visor de resultados. Un solo look oscuro. */
  :root {
    color-scheme: dark;
    --noche: #060e21;          /* fondo general */
    --noche-2: #0a1834;
    --vidrio: rgba(150, 190, 255, .07);
    --vidrio-fuerte: rgba(150, 190, 255, .12);
    --filo: rgba(160, 200, 255, .16);
    --texto: #eaf2ff;
    --tenue: #9fb6dc;
    --apagado: #6a82ab;
    --azul: #3d7bff;           /* acento principal */
    --celeste: #4cc9ff;
    --hielo: #cfe6ff;
    --bien: #5be3b0;
    --alerta: #ff7b86;
    --titulo: "Sora", "Segoe UI", system-ui, sans-serif;
    --cuerpo: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
    --radio: 22px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--noche); color: var(--texto); font: 400 15px/1.55 var(--cuerpo);
         overflow: hidden; -webkit-font-smoothing: antialiased; }
  .fondo { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(60% 50% at 50% 0%, #163a8a55, transparent 70%),
                radial-gradient(40% 40% at 90% 90%, #0f5fa833, transparent 70%),
                linear-gradient(180deg, var(--noche-2), var(--noche)); }

  .app { position: relative; z-index: 1; height: 100%; display: grid; gap: 16px;
         grid-template-columns: minmax(320px, 380px) minmax(0, 1fr) minmax(300px, 360px);
         grid-template-rows: auto minmax(0, 1fr); padding: 14px 16px 16px; }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 4px; flex-wrap: wrap; }
  .marca { display: flex; align-items: baseline; gap: 12px; margin-right: 6px; }
  .marca b { font: 700 21px var(--titulo); letter-spacing: -.01em; }
  .marca b em { font-style: normal; color: var(--celeste); }
  .marca span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
  .pastilla { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: var(--vidrio);
              border: 1px solid var(--filo); font: 500 12px var(--mono); color: var(--tenue); font-variant-numeric: tabular-nums; }
  .pastilla i { width: 7px; height: 7px; border-radius: 50%; background: var(--bien); box-shadow: 0 0 10px var(--bien); }
  .pastilla.ocupado i { background: var(--celeste); box-shadow: 0 0 10px var(--celeste); animation: latir 1s infinite; }
  .espacio { flex: 1; }
  .boton { font: 500 13px var(--cuerpo); color: var(--texto); background: var(--vidrio); border: 1px solid var(--filo); border-radius: 99px;
           padding: 7px 14px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; transition: background .2s, border-color .2s; }
  .boton:hover { background: var(--vidrio-fuerte); border-color: #ffffff30; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
  .boton.on { background: linear-gradient(120deg, var(--azul), var(--celeste)); border-color: transparent; color: #fff; }
  .boton.peligro { color: var(--alerta); }

  .vidrio { background: linear-gradient(180deg, rgba(150,190,255,.09), rgba(150,190,255,.04)); border: 1px solid var(--filo);
            border-radius: var(--radio); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow: 0 30px 60px -30px #000d, inset 0 1px 0 #ffffff12; min-height: 0; min-width: 0;
            display: flex; flex-direction: column; overflow: hidden; }
  .cab { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
  .cab h2 { margin: 0; font: 600 14px var(--titulo); }
  .cab .meta { margin-left: auto; font: 400 11px var(--mono); color: var(--apagado); }

  /* ===== Conversación ===== */
  #consola { flex: 1; overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 14px;
             scrollbar-width: thin; scrollbar-color: #ffffff22 transparent; }
  .msg { animation: entrar .4s cubic-bezier(.2,.8,.2,1); min-width: 0; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } }
  .msg.yo { align-self: flex-end; max-width: 85%; padding: 10px 14px; border-radius: 18px 18px 6px 18px; color: #fff;
            background: linear-gradient(135deg, #2f6bff, #3f9bff); white-space: pre-wrap; box-shadow: 0 10px 30px -12px #3d7bffaa; }
  .msg.jarvis { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; }
  .mini-orbe { width: 26px; height: 26px; border-radius: 50%; margin-top: 2px;
               background: radial-gradient(circle at 35% 30%, #fff, #7fd8ff 40%, #2f6bff 90%); box-shadow: 0 0 14px #4cc9ff88; }
  .texto p { margin: 0 0 8px; } .texto p:last-child { margin: 0; }
  .texto ul, .texto ol { margin: 2px 0 8px; padding-left: 20px; } .texto li { margin: 2px 0; }
  .texto b { font-weight: 600; color: #fff; }
  .texto a { color: var(--celeste); text-underline-offset: 3px; }
  .texto code { font: 400 12.5px var(--mono); color: var(--hielo); }
  .texto table { border-collapse: collapse; font-size: 14px; margin: 6px 0; display: block; overflow-x: auto; }
  .texto td { border-bottom: 1px solid var(--filo); padding: 4px 10px 4px 0; }
  .escribiendo::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 4px; border-radius: 50%;
                        background: var(--celeste); animation: latir .8s infinite; vertical-align: middle; }
  .evento { display: flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 12px 6px 6px; border-radius: 99px;
            background: var(--vidrio); border: 1px solid var(--filo); font-size: 13px; color: var(--tenue); max-width: 100%; }
  .evento .punto { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; color: #08142b; font-weight: 700; }
  .evento b { color: var(--texto); font-weight: 600; }
  .evento .h { font: 400 11px var(--mono); color: var(--apagado); }
  .evento span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.error { align-self: stretch; padding: 10px 14px; border-radius: 14px; background: #ff7b8614; border: 1px solid #ff7b8655;
               color: #ffc2c8; white-space: pre-wrap; }
  .saludo h3 { margin: 2px 0 6px; font: 600 20px/1.25 var(--titulo); }
  .ideas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ideas button { font: 500 13.5px var(--cuerpo); color: var(--texto); background: var(--vidrio); border: 1px solid var(--filo);
                  padding: 8px 13px; border-radius: 99px; cursor: pointer; text-align: left; transition: .2s; }
  .ideas button:hover { border-color: var(--celeste); background: #4cc9ff1a; }
  form { margin: 0 14px 14px; display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 20px; background: #00000040;
         border: 1px solid var(--filo); transition: border-color .2s, box-shadow .2s; }
  form:focus-within { border-color: #4cc9ff88; box-shadow: 0 0 0 4px #4cc9ff1a; }
  textarea { flex: 1; min-width: 0; font: 400 15px var(--cuerpo); color: var(--texto); background: none; border: none; resize: none;
             padding: 9px 8px; max-height: 150px; outline: none; }
  textarea::placeholder { color: var(--apagado); }
  .icono-btn { width: 38px; height: 38px; flex: none; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center;
               background: transparent; color: var(--tenue); transition: .2s; }
  .icono-btn:hover { background: var(--vidrio-fuerte); color: var(--texto); }
  .icono-btn svg { width: 19px; height: 19px; }
  #enviar { background: linear-gradient(135deg, var(--azul), var(--celeste)); color: #fff; }
  #enviar:disabled { opacity: .35; cursor: default; }
  #microfono.escuchando { background: #4cc9ff33; color: var(--celeste); animation: latir 1s infinite; }
  @keyframes latir { 50% { opacity: .45; } }

  /* ===== Oficina ===== */
  .escenario { position: relative; min-height: 0; min-width: 0; border-radius: var(--radio); overflow: hidden;
               border: 1px solid var(--filo); background: #081430; box-shadow: 0 30px 60px -30px #000d; }
  .oficina { position: absolute; left: 50%; top: 50%; width: 1000px; height: 700px; transform-origin: center; }
  .pared { position: absolute; inset: 0 0 auto 0; height: 290px; background: linear-gradient(180deg, #102650, #0d2046 70%, #0b1c3e); }
  .pared::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(180deg, #1a3466, #0f234a); }
  .techo-luz { position: absolute; top: 14px; height: 6px; width: 180px; border-radius: 4px; background: #d8ecff;
               box-shadow: 0 0 24px 6px #8fd0ff66, 0 40px 80px 10px #6fbfff1f; }
  .ventanal { position: absolute; left: 300px; top: 44px; width: 400px; height: 200px; border-radius: 10px; overflow: hidden;
              border: 6px solid #1c3a70; box-shadow: inset 0 0 0 2px #0a1836, 0 0 40px #2a6bff33; }
  .ventanal canvas { width: 100%; height: 100%; display: block; }
  .ventanal::after { content: ""; position: absolute; inset: 0; background:
      linear-gradient(90deg, transparent 49.6%, #1c3a70 49.6% 50.4%, transparent 50.4%),
      linear-gradient(115deg, transparent 30%, #ffffff10 40%, transparent 50%); }
  .repisa { position: absolute; left: 150px; top: 112px; width: 130px; }
  .repisa .tabla { height: 8px; border-radius: 3px; background: #dfeaff; box-shadow: 0 6px 12px #0006; }
  .libros { display: flex; align-items: flex-end; gap: 3px; height: 46px; padding-left: 14px; }
  .libros i { display: block; width: 11px; border-radius: 2px 2px 0 0; }
  .cuadro { position: absolute; right: 150px; top: 76px; width: 170px; height: 104px; border-radius: 8px; background: #0b1a38;
            border: 1px solid #2d4f8a; display: grid; place-items: center; text-align: center; box-shadow: 0 0 30px #3d7bff22; }
  .cuadro b { font: 700 20px var(--titulo); letter-spacing: .3em; color: #dbeaff; display: block; padding-left: .3em; }
  .cuadro span { font: 500 10px var(--mono); letter-spacing: .3em; color: var(--celeste); }
  .reloj { position: absolute; right: 210px; top: 200px; font: 500 13px var(--mono); color: var(--celeste); padding: 3px 10px;
           border-radius: 6px; background: #081430; border: 1px solid #23457e; text-shadow: 0 0 8px #4cc9ff; font-variant-numeric: tabular-nums; }
  .planta { position: absolute; width: 70px; height: 120px; z-index: 200; }
  .piso { position: absolute; inset: 290px 0 0 0; overflow: hidden;
          background: linear-gradient(180deg, #0f2550, #0b1b3c 60%, #091733); }
  .piso::before { content: ""; position: absolute; inset: 0; opacity: .35;
          background: repeating-linear-gradient(90deg, transparent 0 99px, #2a4a85 99px 100px); transform: perspective(300px) rotateX(55deg);
          transform-origin: top; }
  .piso::after { content: ""; position: absolute; left: 25%; right: 25%; top: 0; height: 140px;
          background: radial-gradient(50% 100% at 50% 0%, #4cc9ff26, transparent); }
  .alfombra { position: absolute; left: 290px; top: 432px; width: 420px; height: 130px; border-radius: 50%;
              background: radial-gradient(closest-side, #173a7a, #10295a 70%, transparent 72%); }

  .escritorio { position: absolute; width: 170px; height: 110px; transform: translate(-50%, 0); cursor: pointer; }
  .escritorio .monitor { position: absolute; left: 108px; top: -6px; width: 52px; height: 36px; border-radius: 5px; background: #0a1730;
                         border: 3px solid #d7e4fb; transform: perspective(200px) rotateY(-28deg); transition: box-shadow .4s, background .4s; }
  .escritorio .monitor::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 6px; height: 9px; background: #c4d4f0; transform: translateX(-50%); }
  .escritorio .pantalla { position: absolute; inset: 3px; border-radius: 2px; background: linear-gradient(160deg, var(--c), #0a1730 80%); opacity: .55; }
  .escritorio .pantalla::before { content: ""; position: absolute; left: 5px; right: 12px; top: 6px; height: 2px; background: #fff8;
                                  box-shadow: 0 5px 0 #fff6, 0 10px 0 #fff4, -0 15px 0 #fff3; }
  .escritorio .tablero { position: absolute; left: 0; right: 0; top: 30px; height: 14px; border-radius: 6px;
                         background: linear-gradient(180deg, #f2f7ff, #cddcf5); box-shadow: 0 10px 16px #0008; }
  .escritorio .frente { position: absolute; left: 10px; right: 10px; top: 44px; height: 46px; border-radius: 0 0 8px 8px;
                        background: linear-gradient(180deg, #d5e2f8, #aec2e6); }
  .escritorio .frente::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 7px; height: 3px; border-radius: 2px; background: var(--c); opacity: .9;
                               box-shadow: 0 0 10px var(--c); }
  .escritorio .placa { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); white-space: nowrap; text-align: center; }
  .placa b { display: block; font: 600 12.5px var(--titulo); color: #14284f; }
  .placa span { display: inline-flex; align-items: center; gap: 5px; margin-top: 22px; padding: 2px 9px; border-radius: 99px; font: 500 10.5px var(--mono);
                background: #081430cc; border: 1px solid #ffffff1a; color: var(--tenue); }
  .placa span i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .escritorio.vacio .pantalla { opacity: .15; }
  .escritorio.vacio .placa span { color: var(--c); border-color: color-mix(in srgb, var(--c) 50%, transparent); }
  .escritorio.vacio .placa span i { animation: latir .8s infinite; }
  .escritorio.listo .placa span { color: var(--bien); }

  .mesa { position: absolute; left: 340px; top: 470px; width: 320px; height: 80px; z-index: 492; }
  .mesa .cubierta { position: absolute; inset: 0 0 auto 0; height: 58px; border-radius: 50%;
                    background: radial-gradient(ellipse at 50% 35%, #ffffff, #d6e3f8 60%, #b7c9ea); box-shadow: 0 16px 30px #000a, inset 0 -5px 0 #a3b8de; }
  .mesa .pata { position: absolute; left: 50%; top: 46px; width: 30px; height: 34px; transform: translateX(-50%);
                background: linear-gradient(90deg, #9fb4dc, #d6e3f8, #9fb4dc); border-radius: 0 0 6px 6px; }
  .mesa .proyector { position: absolute; left: 50%; top: 18px; width: 56px; height: 14px; transform: translateX(-50%); border-radius: 50%;
                     background: radial-gradient(#bff0ff, #4cc9ff 50%, #2f6bff); box-shadow: 0 0 24px #4cc9ff; }
  .cono { position: absolute; left: 380px; top: 270px; width: 240px; height: 230px; pointer-events: none;
          clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0); opacity: .5; z-index: 299; transition: opacity .6s;
          background: linear-gradient(0deg, #4cc9ff99, #4cc9ff10 70%, transparent); }
  #orbe { position: absolute; left: 370px; top: 205px; width: 260px; height: 260px; pointer-events: none; z-index: 300; }
  .jarvis-placa { position: absolute; z-index: 600; left: 500px; top: 576px; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .jarvis-placa b { font: 700 18px var(--titulo); letter-spacing: .02em; }
  .jarvis-placa span { display: block; font: 500 11.5px var(--mono); color: var(--tenue); }

  .robot { position: absolute; width: 90px; height: 126px; margin-left: -45px; margin-top: -120px; pointer-events: auto; cursor: pointer;
           transition: left 1.9s cubic-bezier(.45,.05,.3,1), top 1.9s cubic-bezier(.45,.05,.3,1); --c: var(--celeste); }
  .robot svg { width: 90px; height: 126px; overflow: visible; display: block; animation: flotar 3.2s ease-in-out infinite; }
  .robot:nth-of-type(2n) svg { animation-delay: -1.6s; }
  @keyframes flotar { 50% { transform: translateY(-5px); } }
  .robot .sombra { position: absolute; left: 50%; bottom: -6px; width: 54px; height: 10px; transform: translateX(-50%); border-radius: 50%;
                   background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 55%, transparent), transparent); }
  .robot.moviendo svg { animation: deslizar .45s ease-in-out infinite alternate; }
  .robot.moviendo.izq svg { transform-origin: 50% 90%; }
  @keyframes deslizar { from { transform: translateY(-2px) rotate(var(--inclina, 0deg)); } to { transform: translateY(-9px) rotate(var(--inclina, 0deg)); } }
  .robot .ojo { fill: var(--c); filter: drop-shadow(0 0 3px var(--c)); transform-box: fill-box; transform-origin: center; animation: parpadear 5s infinite; }
  @keyframes parpadear { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .robot .pecho { fill: var(--c); opacity: .8; }
  .robot.trabajando .pecho { animation: latir .7s infinite; }
  .robot.trabajando .ojo { animation: mirar 1.2s ease-in-out infinite alternate; }
  @keyframes mirar { from { transform: translateX(-2px); } to { transform: translateX(2px); } }
  .robot .brazo-d { transform-box: fill-box; transform-origin: 50% 10%; }
  .robot.trabajando .brazo-d { animation: saludar .5s ease-in-out infinite alternate; }
  @keyframes saludar { to { transform: rotate(-35deg); } }
  .globo { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); max-width: 220px; width: max-content;
           padding: 6px 11px; border-radius: 12px; background: #f2f7ff; color: #0b1a38; font: 500 12px/1.3 var(--cuerpo);
           box-shadow: 0 8px 20px #0007; animation: entrar .3s ease-out; text-align: center; }
  .globo::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  .globo.listo { background: var(--bien); }
  .robot .nombre-flota { position: absolute; left: 50%; top: 128px; transform: translateX(-50%); white-space: nowrap;
                         font: 600 11px var(--titulo); color: var(--c); text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .4s; }
  .robot.en-mesa .nombre-flota { opacity: 1; }
  #haces { position: absolute; z-index: 800; inset: 0; width: 1000px; height: 700px; pointer-events: none; overflow: visible; }
  #haces path { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 10 8; animation: fluir .6s linear infinite; opacity: .85; }
  @keyframes fluir { to { stroke-dashoffset: -18; } }

  .mision { position: absolute; left: 330px; top: 26px; width: 340px; padding: 14px 16px; border-radius: 16px; z-index: 900;
            background: linear-gradient(180deg, #0d2a5fdd, #0a1f48ee); border: 1px solid #4cc9ff66; backdrop-filter: blur(10px);
            box-shadow: 0 0 40px #4cc9ff33, inset 0 0 30px #4cc9ff14; animation: holo .5s ease-out; }
  @keyframes holo { from { opacity: 0; transform: scaleY(.2); filter: blur(6px) brightness(2); } }
  .mision .eti { font: 500 10px var(--mono); letter-spacing: .16em; color: var(--celeste); text-transform: uppercase; display: flex; justify-content: space-between; }
  .mision h3 { margin: 4px 0 8px; font: 600 15px/1.3 var(--titulo); }
  .mision .barra { height: 4px; border-radius: 4px; background: #ffffff14; overflow: hidden; margin-bottom: 8px; }
  .mision .barra i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--celeste), transparent);
                     animation: cargar 1.4s ease-in-out infinite; }
  @keyframes cargar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .mision ul { list-style: none; margin: 0; padding: 0; font: 400 12px/1.5 var(--mono); color: var(--tenue); max-height: 74px; overflow: hidden;
               display: flex; flex-direction: column-reverse; }
  .mision li { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: entrar .3s; }
  .mision li b { font-weight: 500; }
  .aparicion { position: absolute; left: 430px; top: 250px; width: 140px; height: 140px; border-radius: 14px; overflow: hidden; z-index: 950;
               border: 2px solid var(--celeste); box-shadow: 0 0 40px #4cc9ff88; background: #fff; display: grid; place-items: center;
               animation: aparecer 3.2s ease-in-out forwards; pointer-events: none; }
  .aparicion img { width: 100%; height: 100%; object-fit: cover; }
  .aparicion span { font-size: 44px; color: #0b1a38; }
  @keyframes aparecer { 0% { opacity: 0; transform: scale(.3) translateY(60px); filter: blur(8px) brightness(2); }
                        20%, 75% { opacity: 1; transform: none; filter: none; }
                        100% { opacity: 0; transform: translateX(380px) scale(.4); } }
  .ficha { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); padding: 14px 16px;
           border-radius: 16px; background: #0b1a38f2; border: 1px solid var(--filo); font-size: 14px; color: var(--tenue); z-index: 20; }
  .ficha h4 { margin: 0 0 4px; font: 600 14px var(--titulo); color: var(--texto); }
  .ficha small { display: block; margin-top: 8px; font: 400 11px var(--mono); color: var(--apagado); }

  /* ===== Visor ===== */
  #visor { position: relative; margin: 0 14px; border-radius: 16px; overflow: hidden; background: #00000059; aspect-ratio: 4 / 5;
           max-height: 46vh; display: grid; place-items: center; flex: none; }
  #visor img, #visor video { max-width: 100%; max-height: 100%; object-fit: contain; animation: revelar .7s cubic-bezier(.2,.8,.2,1); }

/* ---------- Decorado: ciudad por la ventana y libros ---------- */
(function decorado() {

  const c = $("#ciudad"), x = c.getContext("2d");
  const cielo = x.createLinearGradient(0, 0, 0, 200); cielo.addColorStop(0, "#081430"); cielo.addColorStop(1, "#1d3f84");

/* ---------- Holograma de Jarvis ---------- */
const orbe = { modo: "reposo", energia: 0 };
(function animarOrbe() {
  const c = $("#orbe"), x = c.getContext("2d"), cx = 260, cy = 260, R = 92;
  let t = 0, ultimo = performance.now();
  const capas = [
    { col: ["#bff0ff", "#4cc9ff", "#0b4a8a00"], fase: 0, k: [3, 5, 2], dx: -.18, dy: -.1 },
    { col: ["#cfe0ff", "#3d7bff", "#10307a00"], fase: 2.1, k: [4, 2, 6], dx: .2, dy: .05 },
    { col: ["#d8f7ff", "#5be3e0", "#0d5a6000"], fase: 4.2, k: [2, 6, 3], dx: 0, dy: .2 },
  ];
  function cuadro(ahora) {
    x.clearRect(0, 0, 520, 520);
    const dt = Math.min(ahora - ultimo, 50) / 1000; ultimo = ahora;
    const meta = { reposo: 0, pensando: 1, hablando: .7 }[orbe.modo] ?? 0;
    orbe.energia += (meta - orbe.energia) * Math.min(1, dt * 3);
    t += dt * (MOVIMIENTO ? (.5 + orbe.energia * 1.6) : 0);
    const halo = x.createRadialGradient(cx, cy, R * .3, cx, cy, R * 2.5);
    halo.addColorStop(0, `rgba(76,201,255,${.25 + orbe.energia * .2})`); halo.addColorStop(1, "rgba(76,201,255,0)");
    x.fillStyle = halo; x.beginPath(); x.arc(cx, cy, R * 2.5, 0, 7); x.fill();
    x.save(); x.translate(cx, cy);
    for (let i = 0; i < 3; i++) {
      x.save(); x.rotate(t * (i % 2 ? -.3 : .2) + i); x.scale(1, .3 + i * .08);
      x.strokeStyle = `rgba(190,230,255,${.18 + orbe.energia * .12})`; x.lineWidth = 2;
      x.beginPath(); x.arc(0, 0, R * (1.4 + i * .22), 0, 7); x.stroke();
      const a = t * (1 + i * .4) + i * 2; x.fillStyle = "#e6f7ff";
      x.beginPath(); x.arc(Math.cos(a) * R * (1.4 + i * .22), Math.sin(a) * R * (1.4 + i * .22), 4, 0, 7); x.fill();
      x.restore();
    }
    x.restore();
    x.globalCompositeOperation = "lighter";
    const amp = .045 + orbe.energia * .08 + (orbe.modo === "hablando" ? Math.abs(Math.sin(t * 9)) * .05 : 0);
    for (const capa of capas) {
      x.beginPath();
      for (let i = 0; i <= 96; i++) {
        const th = i / 96 * Math.PI * 2;
        const d = Math.sin(capa.k[0] * th + t * 1.3 + capa.fase) * .5 + Math.sin(capa.k[1] * th - t * 1.7 + capa.fase) * .3 + Math.sin(capa.k[2] * th + t * .7) * .3;
        const rr = R * (1 + amp * d), px = cx + Math.cos(th) * rr, py = cy + Math.sin(th) * rr;
        i ? x.lineTo(px, py) : x.moveTo(px, py);

      const ox = cx + R * capa.dx * Math.cos(t * .6 + capa.fase), oy = cy + R * capa.dy * Math.sin(t * .5 + capa.fase);
      const g = x.createRadialGradient(ox, oy, R * .05, cx, cy, R * 1.12);
      g.addColorStop(0, capa.col[0]); g.addColorStop(.55, capa.col[1]); g.addColorStop(1, capa.col[2]);
      x.fillStyle = g; x.globalAlpha = .5; x.fill();

    const b = x.createRadialGradient(cx - R * .35, cy - R * .45, 0, cx - R * .35, cy - R * .45, R * .55);
    b.addColorStop(0, "rgba(255,255,255,.5)"); b.addColorStop(1, "rgba(255,255,255,0)");

    requestAnimationFrame(cuadro);

})();

function placa(a, texto, clase) {
  const r = robots[a]; if (!r) return;

  r.desk.classList.toggle("vacio", clase === "vacio"); r.desk.classList.toggle("listo", clase === "listo");

function mover(id, x, y) {
  const r = robots[id]; if (!r) return Promise.resolve();
  const el = r.el; el.style.setProperty("--inclina", (x > r.x ? 6 : -6) + "deg");

}

function haz(id, si) {
  document.querySelector(`#haces path[data-id="${CSS.escape(id)}"]`)?.remove();
  const r = robots[id]; if (!si || !r) return;
  const p = document.createElementNS(NS, "path");
  const hx = r.x, hy = r.y - 92;
  p.setAttribute("d", `M500,335 Q${(500 + hx) / 2},${Math.min(335, hy) - 50} ${hx},${hy}`);
  p.setAttribute("stroke", getComputedStyle(r.el).getPropertyValue("--c").trim()); p.dataset.id = id;
  $("#haces").appendChild(p);
}
async function convocar(id, tarea) {
  const r = robots[id]; if (!r || r.estado === "mesa" || r.estado === "yendo") { if (r) globo(id, "Trabajando…"); return; }
  const libre = ASIENTOS.findIndex((_, i) => !ocupados.has(i)); r.asiento = libre < 0 ? 0 : libre; ocupados.add(r.asiento);
  r.estado = "yendo"; placa(id, "En reunión con Jarvis", "vacio"); globo(id, "¡Voy!");
  const [sx, sy] = ASIENTOS[r.asiento];
  await mover(id, sx, sy);
  if (r.estado !== "yendo") return;
  r.estado = "mesa"; r.el.classList.add("trabajando", "en-mesa"); globo(id, r.pendiente || "Manos a la obra…"); haz(id, true);
}
function actividad(id, txt) {
  const r = robots[id]; if (!r) return;
  r.pendiente = txt; if (r.estado === "mesa") globo(id, txt);
}
async function liberar(id) {
  const r = robots[id]; if (!r || r.estado === "escritorio" || r.estado === "volviendo") return;
  while (r.estado === "yendo") await new Promise((ok) => setTimeout(ok, 200));
  r.el.classList.remove("trabajando"); haz(id, false); globo(id, "¡Listo! ✓", true); placa(id, "Volviendo…", "vacio");
  r.estado = "volviendo";
  await new Promise((ok) => setTimeout(ok, MOVIMIENTO ? 1800 : 0));
  globo(id, ""); r.el.classList.remove("en-mesa"); ocupados.delete(r.asiento); r.asiento = null; r.pendiente = "";
  await mover(id, ...r.casa);
  r.estado = "escritorio"; placa(id, "Tarea completada ✓", "listo");
  setTimeout(() => { if (r.estado === "escritorio") placa(id, "En su escritorio", ""); }, 8000);
}
function verFicha(id) {
  const a = equipo.agentes.find((x) => x.id === id), f = $("#ficha");
  if (!a || (!f.hidden && f.dataset.id === id)) { f.hidden = true; return; }
  f.dataset.id = id; f.innerHTML = `<h4>${esc(a.nombre)}</h4>${esc(a.que_hace)}<small>Herramientas · ${esc(a.herramientas || "—")}</small>`; f.hidden = false;
}
document.addEventListener("click", (e) => { if (!e.target.closest("#ficha")) $("#ficha").hidden = true; });

/* ---------- Misión (holograma con lo que va pasando) ---------- */
function abrirMision(titulo) {
  const m = $("#mision"); if (m.hidden) { m.hidden = false; $("#bitacora").innerHTML = ""; cronoInicio = Date.now(); }
  if (titulo) $("#mision-titulo").textContent = titulo;
}
function bitacora(html) {
  const ul = $("#bitacora"); if (ul.firstChild?.innerHTML === html) return;
  const li = document.createElement("li"); li.innerHTML = html; ul.prepend(li);
  while (ul.children.length > 4) ul.lastChild.remove();
}
function cerrarMision() { setTimeout(() => { if (!ocupado) $("#mision").hidden = true; }, 2500); }
setInterval(() => { if (!$("#mision").hidden) { const s = Math.floor((Date.now() - cronoInicio) / 1000);
  $("#crono").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); } }, 500);
function aparicion(r) {
  const d = document.createElement("div"); d.className = "aparicion";
  d.innerHTML = /\.(jpe?g|png|webp)$/i.test(r) ? `<img src="${urlArchivo(r)}" alt="">` : `<span>${/\.mp4$/i.test(r) ? "▶" : "▦"}</span>`;
  $("#oficina").appendChild(d); setTimeout(() => d.remove(), 3300);
}

function estadoJarvis(modo, frase) {
  orbe.modo = modo || "reposo";
  $("#jarvis-estado").textContent = frase || "Listo para ayudarte";
  $("#cono").style.opacity = modo ? .85 : .5;
  $("#estado").classList.toggle("ocupado", !!modo); $("#estado-texto").textContent = modo ? "Trabajando" : "En línea";
}

/* ---------- Visor ---------- */
function tipoDe(r) {
  if (/\.mp4$/i.test(r)) return "VIDEO";
  if (/\.html$/i.test(r)) return /plan/i.test(r) ? "PLAN" : "VITRINA";
  return /previa/i.test(r) ? "PREVIA" : "FOTO";
}
function nombreBonito(r) {
  const p = r.split("/"), carpeta = p.length > 1 ? p[p.length - 2] : "";
  return (carpeta && !/^(salida|planes)$/.test(carpeta) ? carpeta + " · " : "") + p[p.length - 1];
}
function mostrar(r) {
  const src = urlArchivo(r), t = tipoDe(r), carpeta = r.slice(0, r.lastIndexOf("/") + 1);
  const portada = [...resultados, ...delServidor].find((x) => x.startsWith(carpeta) && /previa.*\.jpe?g$/i.test(x));
  $("#visor").innerHTML = t === "VIDEO" ? `<video src="${src}" ${portada ? `poster="${urlArchivo(portada)}"` : ""} controls autoplay muted loop playsinline></video>`
    : /\.html$/i.test(r) ? `<iframe src="${src}" title="${esc(r)}"></iframe>` : `<img src="${src}" alt="${esc(nombreBonito(r))}">`;
  $("#info-visor").hidden = false; $("#etiqueta").textContent = t; $("#tipo").textContent = t.toLowerCase();
  $("#nombre-visor").textContent = nombreBonito(r); $("#nombre-visor").title = r; $("#abrir").href = src;
  document.querySelectorAll(".mini").forEach((m) => m.classList.toggle("sel", m.dataset.ruta === r));
}
function agregarResultado(r, ya) { if (!resultados.includes(r)) resultados.unshift(r); pintarArchivo(); if (ya) mostrar(r); }
function pintarArchivo() {
  const todas = [...resultados, ...delServidor.filter((r) => !resultados.includes(r))].slice(0, 45);
  const iconos = { VIDEO: "▶", PLAN: "▦", VITRINA: "◫" };
  $("#archivo").innerHTML = todas.map((r) => {
    const t = tipoDe(r), img = /\.(jpe?g|png|webp)$/i.test(r);
    return `<button type="button" class="mini" data-ruta="${esc(r)}" title="${esc(r)}">${img ? `<img src="${urlArchivo(r)}" alt="" loading="lazy">` : `<span class="ico">${iconos[t] || "▢"}</span>`}<small>${esc(r.split("/").slice(-2, -1)[0] || t)}</small></button>`;
  }).join("") || '<div class="nada">Todavía no hay trabajos guardados.</div>';
  $("#cuenta").textContent = todas.length ? todas.length + " elementos" : "";
  document.querySelectorAll(".mini").forEach((m) => m.onclick = () => mostrar(m.dataset.ruta));
}
async function cargarTrabajos() {
  try { delServidor = (await (await fetch("/api/trabajos")).json()).map((t) => t.ruta); pintarArchivo();
        if ($("#info-visor").hidden && delServidor.length) mostrar(delServidor.find((r) => /\.(jpe?g|png)$/i.test(r)) || delServidor[0]); } catch (e) {}
}
async function cargarEquipo() {
  try {
    const nuevo = await (await fetch("/api/equipo")).json();
    const cambio = JSON.stringify(nuevo.agentes.map((a) => a.id)) !== JSON.stringify(equipo.agentes.map((a) => a.id));
    equipo = nuevo; if (cambio) pintarEquipo();
  } catch (e) {}
}

/* ---------- Texto con formato ---------- */
function formatear(md) {
  const enLinea = (t) => esc(t)
    .replace(/`([^`]+)`/g, (_, c) => { const r = c.replace(/&amp;/g, "&");
      return PATRON_RUTA.test(r) ? `<a href="#" data-ruta="${esc(r)}">${esc(r.split("/").pop())}</a>` : `<code>${c}</code>`; })
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", lista = null, tabla = null;
  const cerrar = () => { if (lista) { html += `</${lista}>`; lista = null; } if (tabla) { html += "</table>"; tabla = null; } };
  for (const l of md.split("\n")) {
    let m;
    if (/^\s*\|/.test(l)) {
      if (/^\s*\|[\s:\-|]+\|\s*$/.test(l)) continue;
      if (!tabla) { cerrar(); html += "<table>"; tabla = true; }
      html += "<tr>" + l.trim().replace(/^\||\|$/g, "").split("|").map((c) => `<td>${enLinea(c.trim())}</td>`).join("") + "</tr>";
    } else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (lista !== "ul") { cerrar(); html += "<ul>"; lista = "ul"; } html += `<li>${enLinea(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (lista !== "ol") { cerrar(); html += "<ol>"; lista = "ol"; } html += `<li>${enLinea(m[1])}</li>`; }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))) { cerrar(); html += `<p><b>${enLinea(m[1])}</b></p>`; }
    else if (l.trim() === "") cerrar();
    else { cerrar(); html += `<p>${enLinea(l)}</p>`; }
  }
  cerrar(); return html;
}
const rutasEn = (md) => [...md.matchAll(/`([^`]+)`/g)].map((m) => m[1]).filter((r) => PATRON_RUTA.test(r) && ES_MEDIO.test(r));
consola.addEventListener("click", (e) => { const a = e.target.closest("a[data-ruta]"); if (a) { e.preventDefault(); mostrar(a.dataset.ruta); } });

/* ---------- Conversación ---------- */
const bajar = () => { consola.scrollTop = consola.scrollHeight; };
function quitarSaludo() { consola.querySelector(".saludo")?.remove(); }
function msgYo(t) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg yo"; d.textContent = t; consola.appendChild(d); bajar(); }
function msgJarvis(html) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg jarvis";
  d.innerHTML = `<div class="mini-orbe"></div><div class="texto">${html}</div>`; consola.appendChild(d); bajar(); return d.querySelector(".texto"); }
const eventoHtml = (color, simbolo, html) => `<span class="punto" style="background:${color}">${simbolo}</span><span class="t">${html}</span>`;
function msgEvento(html) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg evento"; d.innerHTML = html; consola.appendChild(d); bajar(); }
function msgError(t) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg error"; d.textContent = t; consola.appendChild(d); bajar(); }
function evento(html) { msgEvento(html); historial.push({ de: "evento", html }); }
function guardar() {
  try { localStorage.setItem("jarvis-historial", JSON.stringify(historial.slice(-100)));
        sesion ? localStorage.setItem("jarvis-sesion", sesion) : localStorage.removeItem("jarvis-sesion"); } catch (e) {}
  $("#sesion").textContent = sesion ? "sesión " + sesion.slice(0, 6) : "nueva";
}
function saludo() {
  consola.innerHTML = "";
  const d = document.createElement("div"); d.className = "msg jarvis saludo";
  d.innerHTML = `<div class="mini-orbe"></div><div class="texto"><h3>Hola, Julio.</h3>
    <p>El equipo está en sus escritorios. Pídeme algo y verás cómo llamo a cada uno a la mesa para trabajar.</p>
    <div class="ideas">${IDEAS.map((i) => `<button type="button">${esc(i)}</button>`).join("")}</div></div>`;
  consola.appendChild(d);
  d.querySelectorAll(".ideas button").forEach((b) => b.onclick = () => { texto.value = b.textContent; mandar(); });
}
function pintarHistorial() {
  if (!historial.length) return saludo();
  consola.innerHTML = "";
  for (const h of historial) {
    if (h.de === "yo") msgYo(h.texto);
    else if (h.de === "jarvis") { msgJarvis(formatear(h.texto)); rutasEn(h.texto).forEach((r) => agregarResultado(r, false)); }
    else if (h.de === "evento") msgEvento(h.html);
  }
  if (resultados.length) mostrar(resultados[0]);
}

/* ---------- Voz ---------- */
function hablar(md) {
  if (!vozActiva || !("speechSynthesis" in window)) return;
  const limpio = md.replace(/`[^`]*`/g, "").replace(/[*#|_>]/g, "").replace(/\s+/g, " ").trim(); if (!limpio) return;
  const u = new SpeechSynthesisUtterance(limpio); u.lang = "es-MX"; u.rate = 1.03;
  const v = speechSynthesis.getVoices().find((x) => /^es/i.test(x.lang)); if (v) u.voice = v;
  u.onstart = () => { if (!ocupado) orbe.modo = "hablando"; }; u.onend = () => { if (!ocupado) orbe.modo = "reposo"; };
  speechSynthesis.speak(u);
}
$("#voz").classList.toggle("on", vozActiva);
$("#voz").onclick = () => { vozActiva = !vozActiva; $("#voz").classList.toggle("on", vozActiva);
  try { localStorage.setItem("jarvis-voz", vozActiva ? "1" : "0"); } catch (e) {}
  if (!vozActiva && "speechSynthesis" in window) speechSynthesis.cancel(); };
const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Reconocer) $("#microfono").hidden = true;
else $("#microfono").onclick = () => {
  const r = new Reconocer(); r.lang = "es-MX"; r.interimResults = true; $("#microfono").classList.add("escuchando");
  r.onresult = (e) => { texto.value = [...e.results].map((x) => x[0].transcript).join(""); ajustar(); };
  r.onend = () => { $("#microfono").classList.remove("escuchando"); if (texto.value.trim()) mandar(); };
  r.onerror = () => msgError("No pude usar el micrófono. Revisa que el navegador tenga permiso para usarlo.");
  r.start();
};

/* ---------- Hablar con Jarvis ---------- */
function setOcupado(si) { ocupado = si; enviarBtn.disabled = si; $("#parar").hidden = !si; if (!si) estadoJarvis("", ""); }
const agenteDe = (id) => equipo.agentes.find((x) => x.id === id) || { nombre: id, color: "#9fb6dc" };

async function mandar() {
  const mensaje = texto.value.trim(); if (!mensaje || ocupado) return;
  texto.value = ""; ajustar(); if ("speechSynthesis" in window) speechSynthesis.cancel();
  msgYo(mensaje); historial.push({ de: "yo", texto: mensaje }); guardar();
  setOcupado(true); estadoJarvis("pensando", "Pensando…");
  abrirMision(mensaje.length > 70 ? mensaje.slice(0, 68) + "…" : mensaje);
  bitacora(`<b style="color:var(--celeste)">Jarvis</b> recibió tu pedido`);
  let caja = null, acumulado = "";
  const cerrarCaja = () => {
    caja?.classList.remove("escribiendo");
    const t = acumulado.trim();
    if (t) { historial.push({ de: "jarvis", texto: t }); const rs = rutasEn(t);
             rs.forEach((r, i) => agregarResultado(r, i === 0)); if (rs[0]) aparicion(rs[0]); hablar(t); }
    caja = null; acumulado = ""; guardar();
  };
  try {
    const r = await fetch("/api/conversar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mensaje, sesion }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || "Jarvis no respondió. Vuelve a intentarlo."); }
    const lector = r.body.getReader(), dec = new TextDecoder(); let resto = "";
    while (true) {
      const { value, done } = await lector.read(); if (done) break;
      resto += dec.decode(value, { stream: true });
      const partes = resto.split("\n"); resto = partes.pop();
      for (const l of partes) {
        if (!l.trim()) continue; const ev = JSON.parse(l);
        if (ev.tipo === "sesion" && ev.sesion) { sesion = ev.sesion; guardar(); }
        else if (ev.tipo === "corte") cerrarCaja();
        else if (ev.tipo === "texto") {
          if (!caja) { caja = msgJarvis(""); caja.classList.add("escribiendo"); }
          acumulado += ev.texto; caja.innerHTML = formatear(acumulado); bajar();
          estadoJarvis(misionActiva.size ? "pensando" : "hablando", misionActiva.size ? "Coordinando al equipo" : "Respondiendo…");
        } else if (ev.tipo === "agente_empieza") {
          cerrarCaja(); const a = agenteDe(ev.agente); misionActiva.add(ev.agente);
          evento(eventoHtml(a.color, "→", `Jarvis llamó a <b>${esc(a.nombre)}</b>${ev.tarea ? ` <span class="h">· ${esc(ev.tarea)}</span>` : ""}`));
          abrirMision(ev.tarea || null); bitacora(`<b style="color:${a.color}">${esc(a.nombre)}</b> va a la mesa`);
          convocar(ev.agente, ev.tarea); estadoJarvis("pensando", `Coordinando a ${a.nombre}`);
        } else if (ev.tipo === "agente_hace") {
          const a = agenteDe(ev.agente); actividad(ev.agente, ev.texto); bitacora(`<b style="color:${a.color}">${esc(a.nombre)}</b> · ${esc(ev.texto)}`);
        } else if (ev.tipo === "jarvis_hace") { estadoJarvis("pensando", ev.texto); bitacora(`<b style="color:var(--celeste)">Jarvis</b> · ${esc(ev.texto)}`); }
        else if (ev.tipo === "agente_termina") {
          const a = agenteDe(ev.agente); misionActiva.delete(ev.agente); liberar(ev.agente);
          evento(eventoHtml(a.color, "✓", `<b>${esc(a.nombre)}</b> terminó <span class="h">· ${hora()}</span>`));
          bitacora(`<b style="color:${a.color}">${esc(a.nombre)}</b> terminó ✓`);
          estadoJarvis("pensando", "Revisando resultados…"); cargarTrabajos();
        } else if (ev.tipo === "error") { cerrarCaja(); msgError(ev.texto); }
      }
    }
  } catch (e) { msgError(e.message || "Se cortó la conexión. Revisa que la ventana del panel siga abierta."); }
  cerrarCaja(); misionActiva.forEach((id) => liberar(id)); misionActiva.clear();
  bitacora(`<b style="color:var(--bien)">Misión completa</b>`); setOcupado(false); cerrarMision(); cargarTrabajos(); cargarEquipo();
}

function ajustar() { texto.style.height = "auto"; texto.style.height = Math.min(texto.scrollHeight, 150) + "px"; }
texto.addEventListener("input", ajustar);
texto.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mandar(); } });
$("#formulario").onsubmit = (e) => { e.preventDefault(); mandar(); };
$("#parar").onclick = () => fetch("/api/parar", { method: "POST" });
$("#nueva").onclick = () => { if (ocupado) return; sesion = null; historial = []; resultados = []; guardar(); saludo(); pintarArchivo(); };

escalar();
cargarEquipo().then(() => { pintarHistorial(); guardar(); });
cargarTrabajos();
setInterval(() => { if (!ocupado) { cargarEquipo(); cargarTrabajos(); } }, 15000);
</script>
