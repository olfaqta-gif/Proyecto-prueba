<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina de Isa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Concepto: la oficina de Isa de noche. Al centro, una oficina limpia en tonos azules
     con ventanal a la ciudad: cada agente es un robot en su escritorio y, cuando Isa lo
     llama, flota hasta la mesa de reuniones bajo el holograma de Isa. A los lados,
     paneles de vidrio azul: la conversación y el visor de resultados. Un solo look oscuro. */
  :root {
    color-scheme: dark;
    --noche: #060e21;          /* fondo general */
    --noche-2: #0a1834;
    --vidrio: rgba(150, 190, 255, .07);
    --vidrio-fuerte: rgba(150, 190, 255, .12);
    --filo: rgba(160, 200, 255, .16);
    --texto: #eaf2ff;
    --tenue: #9fb6dc;
    --apagado: #6a82ab;
    --azul: #3d7bff;           /* acento principal */
    --celeste: #4cc9ff;
    --hielo: #cfe6ff;
    --bien: #5be3b0;
    --alerta: #ff7b86;
    --titulo: "Sora", "Segoe UI", system-ui, sans-serif;
    --cuerpo: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
    --radio: 22px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--noche); color: var(--texto); font: 400 15px/1.55 var(--cuerpo);
         overflow: hidden; -webkit-font-smoothing: antialiased; }
  .fondo { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(60% 50% at 50% 0%, #163a8a55, transparent 70%),
                radial-gradient(40% 40% at 90% 90%, #0f5fa833, transparent 70%),
                linear-gradient(180deg, var(--noche-2), var(--noche)); }

  .app { position: relative; z-index: 1; height: 100%; display: grid; gap: 16px;
         grid-template-columns: minmax(320px, 380px) minmax(0, 1fr) minmax(300px, 360px);
         grid-template-rows: auto minmax(0, 1fr); padding: 14px 16px 16px; }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 4px; flex-wrap: wrap; }
  .marca { display: flex; align-items: baseline; gap: 12px; margin-right: 6px; }
  .marca b { font: 700 21px var(--titulo); letter-spacing: -.01em; }
  .marca b em { font-style: normal; color: var(--celeste); }
  .marca span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
  .pastilla { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: var(--vidrio);
              border: 1px solid var(--filo); font: 500 12px var(--mono); color: var(--tenue); font-variant-numeric: tabular-nums; }
  .pastilla i { width: 7px; height: 7px; border-radius: 50%; background: var(--bien); box-shadow: 0 0 10px var(--bien); }
  .pastilla.ocupado i { background: var(--celeste); box-shadow: 0 0 10px var(--celeste); animation: latir 1s infinite; }
  .espacio { flex: 1; }
  .boton { font: 500 13px var(--cuerpo); color: var(--texto); background: var(--vidrio); border: 1px solid var(--filo); border-radius: 99px;
           padding: 7px 14px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; transition: background .2s, border-color .2s; }
  .boton:hover { background: var(--vidrio-fuerte); border-color: #ffffff30; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--celeste); outline-offset: 2px; }
  .boton.on { background: linear-gradient(120deg, var(--azul), var(--celeste)); border-color: transparent; color: #fff; }
  .boton.peligro { color: var(--alerta); }

  .vidrio { background: linear-gradient(180deg, rgba(150,190,255,.09), rgba(150,190,255,.04)); border: 1px solid var(--filo);
            border-radius: var(--radio); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow: 0 30px 60px -30px #000d, inset 0 1px 0 #ffffff12; min-height: 0; min-width: 0;
            display: flex; flex-direction: column; overflow: hidden; }
  .cab { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
  .cab h2 { margin: 0; font: 600 14px var(--titulo); }
  .cab .meta { margin-left: auto; font: 400 11px var(--mono); color: var(--apagado); }

  /* ===== Conversación ===== */
  #consola { flex: 1; overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 14px;
             scrollbar-width: thin; scrollbar-color: #ffffff22 transparent; }
  .msg { animation: entrar .4s cubic-bezier(.2,.8,.2,1); min-width: 0; }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } }
  .msg.yo { align-self: flex-end; max-width: 85%; padding: 10px 14px; border-radius: 18px 18px 6px 18px; color: #fff;
            background: linear-gradient(135deg, #2f6bff, #3f9bff); white-space: pre-wrap; box-shadow: 0 10px 30px -12px #3d7bffaa; }
  .msg.isa { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; }
  .mini-orbe { width: 26px; height: 26px; border-radius: 50%; margin-top: 2px;
               background: radial-gradient(circle at 35% 30%, #fff, #7fd8ff 40%, #2f6bff 90%); box-shadow: 0 0 14px #4cc9ff88; }
  .texto p { margin: 0 0 8px; } .texto p:last-child { margin: 0; }
  .texto ul, .texto ol { margin: 2px 0 8px; padding-left: 20px; } .texto li { margin: 2px 0; }
  .texto b { font-weight: 600; color: #fff; }
  .texto a { color: var(--celeste); text-underline-offset: 3px; }
  .texto code { font: 400 12.5px var(--mono); color: var(--hielo); }
  .texto table { border-collapse: collapse; font-size: 14px; margin: 6px 0; display: block; overflow-x: auto; }
  .texto td { border-bottom: 1px solid var(--filo); padding: 4px 10px 4px 0; }
  .escribiendo::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 4px; border-radius: 50%;
                        background: var(--celeste); animation: latir .8s infinite; vertical-align: middle; }
  .evento { display: flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 12px 6px 6px; border-radius: 99px;
            background: var(--vidrio); border: 1px solid var(--filo); font-size: 13px; color: var(--tenue); max-width: 100%; }
  .evento .punto { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; color: #08142b; font-weight: 700; }
  .evento b { color: var(--texto); font-weight: 600; }
  .evento .h { font: 400 11px var(--mono); color: var(--apagado); }
  .evento span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.error { align-self: stretch; padding: 10px 14px; border-radius: 14px; background: #ff7b8614; border: 1px solid #ff7b8655;
               color: #ffc2c8; white-space: pre-wrap; }
  .saludo h3 { margin: 2px 0 6px; font: 600 20px/1.25 var(--titulo); }
  .ideas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ideas button { font: 500 13.5px var(--cuerpo); color: var(--texto); background: var(--vidrio); border: 1px solid var(--filo);
                  padding: 8px 13px; border-radius: 99px; cursor: pointer; text-align: left; transition: .2s; }
  .ideas button:hover { border-color: var(--celeste); background: #4cc9ff1a; }
  form { margin: 0 14px 14px; display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 20px; background: #00000040;
         border: 1px solid var(--filo); transition: border-color .2s, box-shadow .2s; }
  form:focus-within { border-color: #4cc9ff88; box-shadow: 0 0 0 4px #4cc9ff1a; }
  textarea { flex: 1; min-width: 0; font: 400 15px var(--cuerpo); color: var(--texto); background: none; border: none; resize: none;
             padding: 9px 8px; max-height: 150px; outline: none; }
  textarea::placeholder { color: var(--apagado); }
  .icono-btn { width: 38px; height: 38px; flex: none; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center;
               background: transparent; color: var(--tenue); transition: .2s; }
  .icono-btn:hover { background: var(--vidrio-fuerte); color: var(--texto); }
  .icono-btn svg { width: 19px; height: 19px; }
  #enviar { background: linear-gradient(135deg, var(--azul), var(--celeste)); color: #fff; }
  #enviar:disabled { opacity: .35; cursor: default; }
  #microfono.escuchando { background: #4cc9ff33; color: var(--celeste); animation: latir 1s infinite; }
  @keyframes latir { 50% { opacity: .45; } }

  /* ===== Oficina 3D ===== */
  .escenario { position: relative; min-height: 0; min-width: 0; border-radius: var(--radio); overflow: hidden;
               border: 1px solid var(--filo); box-shadow: 0 30px 60px -30px #000d;
               background: radial-gradient(80% 70% at 50% 40%, #1d4fae, #0c2459 60%, #081638); }
  .escenario > canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  .capa-etiquetas { position: absolute !important; inset: 0; pointer-events: none; overflow: hidden; }
  .sin-3d { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--tenue); }
  .sin-3d b { display: block; font: 600 17px var(--titulo); color: var(--texto); margin-bottom: 6px; }

  .etq-robot { --c: var(--celeste); display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: auto; cursor: pointer;
               transform: translateY(-4px); }
  .etq-robot > b { font: 600 12px var(--titulo); color: #fff; padding: 3px 10px 3px 8px; border-radius: 99px; white-space: nowrap;
                   background: #0b1a38d9; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
                   box-shadow: 0 4px 14px #0007; display: inline-flex; align-items: center; gap: 6px; }
  .etq-robot > b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .etq-robot > span { display: inline-flex; align-items: center; gap: 5px; font: 500 10px var(--mono); color: var(--hielo); white-space: nowrap;
                      padding: 1px 8px; border-radius: 99px; background: #08143099; opacity: .85; }
  .etq-robot > span i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .etq-robot[data-estado="reunion"] > span { color: var(--c); }
  .etq-robot[data-estado="reunion"] > span i { animation: latir .8s infinite; }
  .etq-robot[data-estado="listo"] > span { color: var(--bien); }
  .etq-robot .globo { order: -1; max-width: 210px; width: max-content; padding: 6px 11px; border-radius: 12px; margin-bottom: 4px;
                      background: #f4f8ff; color: #0b1a38; font: 500 12px/1.3 var(--cuerpo); text-align: center; position: relative;
                      box-shadow: 0 8px 22px #0008; animation: entrar .3s ease-out; }
  .etq-robot .globo::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit;
                             transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  .etq-robot .globo.listo { background: var(--bien); }
  .etq-isa { text-align: center; white-space: nowrap; pointer-events: none; }
  .etq-isa b { display: block; font: 700 17px var(--titulo); color: #fff; letter-spacing: .02em; text-shadow: 0 0 14px #4cc9ff, 0 2px 6px #0009; }
  .etq-isa span { display: inline-block; margin-top: 2px; font: 500 11px var(--mono); color: var(--hielo); padding: 2px 9px; border-radius: 99px;
                     background: #081430b3; border: 1px solid #4cc9ff55; }
  .ayuda-3d { position: absolute; right: 14px; bottom: 12px; font: 500 10.5px var(--mono); color: #cfe6ffaa; pointer-events: none;
              padding: 4px 10px; border-radius: 99px; background: #08143080; }

  .mision { position: absolute; left: 16px; top: 16px; width: min(330px, calc(100% - 32px)); padding: 14px 16px; border-radius: 16px; z-index: 5;
            background: linear-gradient(180deg, #0d2a5fdd, #0a1f48ee); border: 1px solid #4cc9ff66; backdrop-filter: blur(10px);
            box-shadow: 0 0 40px #4cc9ff33, inset 0 0 30px #4cc9ff14; animation: holo .5s ease-out; pointer-events: none; }
  @keyframes holo { from { opacity: 0; transform: scaleY(.2); filter: blur(6px) brightness(2); } }
  .mision .eti { font: 500 10px var(--mono); letter-spacing: .16em; color: var(--celeste); text-transform: uppercase; display: flex; justify-content: space-between; }
  .mision h3 { margin: 4px 0 8px; font: 600 15px/1.3 var(--titulo); }
  .mision .barra { height: 4px; border-radius: 4px; background: #ffffff14; overflow: hidden; margin-bottom: 8px; }
  .mision .barra i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--celeste), transparent);
                     animation: cargar 1.4s ease-in-out infinite; }
  @keyframes cargar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .mision ul { list-style: none; margin: 0; padding: 0; font: 400 12px/1.5 var(--mono); color: var(--tenue); max-height: 74px; overflow: hidden;
               display: flex; flex-direction: column-reverse; }
  .mision li { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: entrar .3s; }
  .mision li b { font-weight: 500; }
  .ficha { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); padding: 14px 16px;
           border-radius: 16px; background: #0b1a38f2; border: 1px solid var(--filo); font-size: 14px; color: var(--tenue); z-index: 20; }
  .ficha h4 { margin: 0 0 4px; font: 600 14px var(--titulo); color: var(--texto); }
  .ficha small { display: block; margin-top: 8px; font: 400 11px var(--mono); color: var(--apagado); }

  /* ===== Visor ===== */
  #visor { position: relative; margin: 0 14px; border-radius: 16px; overflow: hidden; background: #00000059; aspect-ratio: 4 / 5;
           max-height: 46vh; display: grid; place-items: center; flex: none; }
  #visor img, #visor video { max-width: 100%; max-height: 100%; object-fit: contain; animation: revelar .7s cubic-bezier(.2,.8,.2,1); }
  #visor iframe { width: 100%; height: 100%; border: 0; background: #fff; animation: revelar .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes revelar { from { opacity: 0; transform: scale(1.04); filter: blur(12px); } }
  .vacio-visor { text-align: center; padding: 20px; color: var(--apagado); font-size: 13.5px; }
  .info-visor { display: flex; align-items: center; gap: 10px; padding: 12px 18px 4px; min-width: 0; }
  .info-visor .etiqueta { font: 500 10px var(--mono); letter-spacing: .12em; padding: 3px 8px; border-radius: 6px; background: #4cc9ff22; color: var(--celeste); flex: none; }
  .info-visor .nombre { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info-visor a { font-size: 13px; color: var(--texto); text-decoration: none; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--filo); flex: none; }
  .info-visor a:hover { background: var(--vidrio-fuerte); }
  .sub { padding: 14px 18px 8px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--apagado); display: flex; justify-content: space-between; }
  #archivo { flex: 1; overflow-y: auto; padding: 0 14px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
             grid-auto-rows: max-content; align-content: start; scrollbar-width: thin; scrollbar-color: #ffffff22 transparent; }
  .mini { aspect-ratio: 1; width: 100%; border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid var(--filo);
          background: var(--vidrio); display: grid; place-items: center; padding: 0; color: var(--tenue); transition: .2s; }
  .mini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mini .ico { font-size: 22px; }
  .mini small { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; font: 400 10px var(--mono); color: #fff;
                background: linear-gradient(transparent, #000c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .mini:hover { transform: translateY(-2px); border-color: #ffffff40; }
  .mini.sel { border-color: var(--celeste); box-shadow: 0 0 0 2px #4cc9ff55; }
  .nada { grid-column: 1 / -1; color: var(--apagado); font-size: 13.5px; padding: 6px 4px; }

  @media (max-width: 1440px) and (min-width: 1181px) { .app { grid-template-columns: 300px minmax(0, 1fr) 280px; } }
  @media (max-width: 1180px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: minmax(0, 1fr); }
    header { order: -2; }
    .escenario { order: -1; aspect-ratio: 1; max-height: 78vh; }
    .conversacion { height: 75vh; }
  }
  @media (max-width: 560px) { .marca span, #hora { display: none; } .app { padding-inline: 16px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="fondo"></div>
<div class="app">
  <header>
    <div class="marca"><b>I<em>sa</em></b><span>Farmasi · Isabella</span></div>
    <div class="pastilla" id="estado"><i></i><span id="estado-texto">En línea</span></div>
    <div class="espacio"></div>
    <div class="pastilla" id="hora">--:--</div>
    <button class="boton" id="voz" type="button" title="Isa lee sus respuestas en voz alta">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>Voz</button>
    <button class="boton peligro" id="parar" type="button" hidden>Detener</button>
    <button class="boton" id="nueva" type="button">Nueva conversación</button>
  </header>

  <section class="vidrio conversacion">
    <div class="cab"><h2>Conversación</h2><span class="meta" id="sesion">nueva</span></div>
    <div id="consola"></div>
    <form id="formulario">
      <button type="button" class="icono-btn" id="microfono" title="Hablarle a Isa" aria-label="Hablarle a Isa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button>
      <textarea id="texto" rows="1" placeholder="Pídele algo a Isa…" aria-label="Mensaje para Isa"></textarea>
      <button type="submit" class="icono-btn" id="enviar" title="Enviar" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>

  <section class="escenario" id="escenario" aria-label="La oficina de Isa y su equipo, en 3D">
    <div class="mision" id="mision" hidden>
      <div class="eti"><span>Misión en curso</span><span id="crono">00:00</span></div>
      <h3 id="mision-titulo">Isa está pensando</h3>
      <div class="barra"><i></i></div>
      <ul id="bitacora"></ul>
    </div>
    <div class="ayuda-3d">Toca un robot para ver qué hace</div>
    <div class="ficha" id="ficha" hidden></div>
  </section>

  <section class="vidrio">
    <div class="cab"><h2>Visor</h2><span class="meta" id="tipo"></span></div>
    <div id="visor"><div class="vacio-visor">Aquí verás las fotos, videos y planes<br>que te entregue el equipo.</div></div>
    <div class="info-visor" id="info-visor" hidden><span class="etiqueta" id="etiqueta"></span><span class="nombre" id="nombre-visor"></span><a id="abrir" target="_blank" rel="noopener">Abrir</a></div>
    <div class="sub"><span>Archivo</span><span id="cuenta"></span></div>
    <div id="archivo"></div>
  </section>
</div>

<script type="module">
import { crearOficina } from "/panel/oficina3d.js";
const $ = (s) => document.querySelector(s);
const consola = $("#consola"), texto = $("#texto"), enviarBtn = $("#enviar"), NS = "http://www.w3.org/2000/svg";
const MOVIMIENTO = !matchMedia("(prefers-reduced-motion: reduce)").matches;
let equipo = { agentes: [], habilidades: [] }, sesion = null, ocupado = false, vozActiva = false;
let historial = [], resultados = [], delServidor = [];
try { sesion = localStorage.getItem("isa-sesion"); historial = JSON.parse(localStorage.getItem("isa-historial") || "[]");
      vozActiva = localStorage.getItem("isa-voz") === "1"; } catch (e) { historial = []; }

const IDEAS = ["Búscame los 3 productos con mejores reseñas", "¿Qué publico las próximas 2 semanas?",
               "Hazme un anuncio del Vitamin C Glow Serum", "Preséntame a tu equipo"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const urlArchivo = (r) => `/archivo?ruta=${encodeURIComponent(r)}`;
const PATRON_RUTA = /^[\w.\-\/]+\.(mp4|html|jpg|jpeg|png|json|txt|csv|webp)$/i;
const ES_MEDIO = /\.(mp4|jpe?g|png|webp|html)$/i;
const hora = () => new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
setInterval(() => {
  const d = new Date(); $("#hora").textContent = d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}, 1000);

/* ---------- La oficina 3D ---------- */
let oficina = null;
try { oficina = crearOficina($("#escenario"), { alTocarAgente: (id) => verFicha(id) }); }
catch (e) {
  const d = document.createElement("div"); d.className = "sin-3d";
  d.innerHTML = "<div><b>Tu navegador no pudo dibujar la oficina en 3D</b>Prueba abrir el panel en Google Chrome o Microsoft Edge.<br>La conversación funciona igual.</div>";
  $("#escenario").appendChild(d);
}
const of = (accion, ...args) => { try { oficina?.[accion](...args); } catch (e) { console.error(e); } };
let misionActiva = new Set(), cronoInicio = 0;

function verFicha(id) {
  const a = equipo.agentes.find((x) => x.id === id), f = $("#ficha");
  if (!a || (!f.hidden && f.dataset.id === id)) { f.hidden = true; return; }
  f.dataset.id = id; f.innerHTML = `<h4>${esc(a.nombre)}</h4>${esc(a.que_hace)}<small>Herramientas · ${esc(a.herramientas || "—")}</small>`; f.hidden = false;
}
document.addEventListener("click", (e) => { if (!e.target.closest("#ficha, .etq-robot, .escenario > canvas")) $("#ficha").hidden = true; });

/* ---------- Misión (holograma con lo que va pasando) ---------- */
function abrirMision(titulo) {
  const m = $("#mision"); if (m.hidden) { m.hidden = false; $("#bitacora").innerHTML = ""; cronoInicio = Date.now(); }
  if (titulo) $("#mision-titulo").textContent = titulo;
}
function bitacora(html) {
  const ul = $("#bitacora"); if (ul.firstChild?.innerHTML === html) return;
  const li = document.createElement("li"); li.innerHTML = html; ul.prepend(li);
  while (ul.children.length > 4) ul.lastChild.remove();
}
function cerrarMision() { setTimeout(() => { if (!ocupado) { $("#mision").hidden = true; of("reunion", false); } }, 2500); }
setInterval(() => { if (!$("#mision").hidden) { const s = Math.floor((Date.now() - cronoInicio) / 1000);
  $("#crono").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); } }, 500);
function aparicion(r) { of("mostrarResultado", urlArchivo(r), /\.(jpe?g|png|webp)$/i.test(r)); }

function estadoIsa(modo, frase) {
  of("isa", modo || "reposo", frase);
  $("#estado").classList.toggle("ocupado", !!modo); $("#estado-texto").textContent = modo ? "Trabajando" : "En línea";
}

/* ---------- Visor ---------- */
function tipoDe(r) {
  if (/\.mp4$/i.test(r)) return "VIDEO";
  if (/\.html$/i.test(r)) return /plan/i.test(r) ? "PLAN" : "VITRINA";
  return /previa/i.test(r) ? "PREVIA" : "FOTO";
}
function nombreBonito(r) {
  const p = r.split("/"), carpeta = p.length > 1 ? p[p.length - 2] : "";
  return (carpeta && !/^(salida|planes)$/.test(carpeta) ? carpeta + " · " : "") + p[p.length - 1];
}
function mostrar(r) {
  const src = urlArchivo(r), t = tipoDe(r), carpeta = r.slice(0, r.lastIndexOf("/") + 1);
  const portada = [...resultados, ...delServidor].find((x) => x.startsWith(carpeta) && /previa.*\.jpe?g$/i.test(x));
  $("#visor").innerHTML = t === "VIDEO" ? `<video src="${src}" ${portada ? `poster="${urlArchivo(portada)}"` : ""} controls autoplay muted loop playsinline></video>`
    : /\.html$/i.test(r) ? `<iframe src="${src}" title="${esc(r)}"></iframe>` : `<img src="${src}" alt="${esc(nombreBonito(r))}">`;
  $("#info-visor").hidden = false; $("#etiqueta").textContent = t; $("#tipo").textContent = t.toLowerCase();
  $("#nombre-visor").textContent = nombreBonito(r); $("#nombre-visor").title = r; $("#abrir").href = src;
  document.querySelectorAll(".mini").forEach((m) => m.classList.toggle("sel", m.dataset.ruta === r));
}
function agregarResultado(r, ya) { if (!resultados.includes(r)) resultados.unshift(r); pintarArchivo(); if (ya) mostrar(r); }
function pintarArchivo() {
  const todas = [...resultados, ...delServidor.filter((r) => !resultados.includes(r))].slice(0, 45);
  const iconos = { VIDEO: "▶", PLAN: "▦", VITRINA: "◫" };
  $("#archivo").innerHTML = todas.map((r) => {
    const t = tipoDe(r), img = /\.(jpe?g|png|webp)$/i.test(r);
    return `<button type="button" class="mini" data-ruta="${esc(r)}" title="${esc(r)}">${img ? `<img src="${urlArchivo(r)}" alt="" loading="lazy">` : `<span class="ico">${iconos[t] || "▢"}</span>`}<small>${esc(r.split("/").slice(-2, -1)[0] || t)}</small></button>`;
  }).join("") || '<div class="nada">Todavía no hay trabajos guardados.</div>';
  $("#cuenta").textContent = todas.length ? todas.length + " elementos" : "";
  document.querySelectorAll(".mini").forEach((m) => m.onclick = () => mostrar(m.dataset.ruta));
}
async function cargarTrabajos() {
  try { delServidor = (await (await fetch("/api/trabajos")).json()).map((t) => t.ruta); pintarArchivo();
        if ($("#info-visor").hidden && delServidor.length) mostrar(delServidor.find((r) => /\.(jpe?g|png)$/i.test(r)) || delServidor[0]); } catch (e) {}
}
async function cargarEquipo() {
  try {
    const nuevo = await (await fetch("/api/equipo")).json();
    const cambio = JSON.stringify(nuevo.agentes.map((a) => a.id)) !== JSON.stringify(equipo.agentes.map((a) => a.id));
    equipo = nuevo; if (cambio) of("setEquipo", equipo.agentes);
  } catch (e) {}
}

/* ---------- Texto con formato ---------- */
function formatear(md) {
  const enLinea = (t) => esc(t)
    .replace(/`([^`]+)`/g, (_, c) => { const r = c.replace(/&amp;/g, "&");
      return PATRON_RUTA.test(r) ? `<a href="#" data-ruta="${esc(r)}">${esc(r.split("/").pop())}</a>` : `<code>${c}</code>`; })
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", lista = null, tabla = null;
  const cerrar = () => { if (lista) { html += `</${lista}>`; lista = null; } if (tabla) { html += "</table>"; tabla = null; } };
  for (const l of md.split("\n")) {
    let m;
    if (/^\s*\|/.test(l)) {
      if (/^\s*\|[\s:\-|]+\|\s*$/.test(l)) continue;
      if (!tabla) { cerrar(); html += "<table>"; tabla = true; }
      html += "<tr>" + l.trim().replace(/^\||\|$/g, "").split("|").map((c) => `<td>${enLinea(c.trim())}</td>`).join("") + "</tr>";
    } else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (lista !== "ul") { cerrar(); html += "<ul>"; lista = "ul"; } html += `<li>${enLinea(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (lista !== "ol") { cerrar(); html += "<ol>"; lista = "ol"; } html += `<li>${enLinea(m[1])}</li>`; }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))) { cerrar(); html += `<p><b>${enLinea(m[1])}</b></p>`; }
    else if (l.trim() === "") cerrar();
    else { cerrar(); html += `<p>${enLinea(l)}</p>`; }
  }
  cerrar(); return html;
}
const rutasEn = (md) => [...md.matchAll(/`([^`]+)`/g)].map((m) => m[1]).filter((r) => PATRON_RUTA.test(r) && ES_MEDIO.test(r));
consola.addEventListener("click", (e) => { const a = e.target.closest("a[data-ruta]"); if (a) { e.preventDefault(); mostrar(a.dataset.ruta); } });

/* ---------- Conversación ---------- */
const bajar = () => { consola.scrollTop = consola.scrollHeight; };
function quitarSaludo() { consola.querySelector(".saludo")?.remove(); }
function msgYo(t) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg yo"; d.textContent = t; consola.appendChild(d); bajar(); }
function msgIsa(html) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg isa";
  d.innerHTML = `<div class="mini-orbe"></div><div class="texto">${html}</div>`; consola.appendChild(d); bajar(); return d.querySelector(".texto"); }
const eventoHtml = (color, simbolo, html) => `<span class="punto" style="background:${color}">${simbolo}</span><span class="t">${html}</span>`;
function msgEvento(html) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg evento"; d.innerHTML = html; consola.appendChild(d); bajar(); }
function msgError(t) { quitarSaludo(); const d = document.createElement("div"); d.className = "msg error"; d.textContent = t; consola.appendChild(d); bajar(); }
function evento(html) { msgEvento(html); historial.push({ de: "evento", html }); }
function guardar() {
  try { localStorage.setItem("isa-historial", JSON.stringify(historial.slice(-100)));
        sesion ? localStorage.setItem("isa-sesion", sesion) : localStorage.removeItem("isa-sesion"); } catch (e) {}
  $("#sesion").textContent = sesion ? "sesión " + sesion.slice(0, 6) : "nueva";
}
function saludo() {
  consola.innerHTML = "";
  const d = document.createElement("div"); d.className = "msg isa saludo";
  d.innerHTML = `<div class="mini-orbe"></div><div class="texto"><h3>Hola, Isabella.</h3>
    <p>El equipo está en sus escritorios. Pídeme algo y verás cómo llamo a cada uno a la mesa para trabajar.</p>
    <div class="ideas">${IDEAS.map((i) => `<button type="button">${esc(i)}</button>`).join("")}</div></div>`;
  consola.appendChild(d);
  d.querySelectorAll(".ideas button").forEach((b) => b.onclick = () => { texto.value = b.textContent; mandar(); });
}
function pintarHistorial() {
  if (!historial.length) return saludo();
  consola.innerHTML = "";
  for (const h of historial) {
    if (h.de === "yo") msgYo(h.texto);
    else if (h.de === "isa") { msgIsa(formatear(h.texto)); rutasEn(h.texto).forEach((r) => agregarResultado(r, false)); }
    else if (h.de === "evento") msgEvento(h.html);
  }
  if (resultados.length) mostrar(resultados[0]);
}

/* ---------- Voz ---------- */
function hablar(md) {
  if (!vozActiva || !("speechSynthesis" in window)) return;
  const limpio = md.replace(/`[^`]*`/g, "").replace(/[*#|_>]/g, "").replace(/\s+/g, " ").trim(); if (!limpio) return;
  const u = new SpeechSynthesisUtterance(limpio); u.lang = "es-MX"; u.rate = 1.03;
  const v = speechSynthesis.getVoices().find((x) => /^es/i.test(x.lang)); if (v) u.voice = v;
  u.onstart = () => { if (!ocupado) of("isa", "hablando", "Hablando…"); }; u.onend = () => { if (!ocupado) of("isa", "reposo"); };
  speechSynthesis.speak(u);
}
$("#voz").classList.toggle("on", vozActiva);
$("#voz").onclick = () => { vozActiva = !vozActiva; $("#voz").classList.toggle("on", vozActiva);
  try { localStorage.setItem("isa-voz", vozActiva ? "1" : "0"); } catch (e) {}
  if (!vozActiva && "speechSynthesis" in window) speechSynthesis.cancel(); };
const Reconocer = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Reconocer) $("#microfono").hidden = true;
else $("#microfono").onclick = () => {
  const r = new Reconocer(); r.lang = "es-MX"; r.interimResults = true; $("#microfono").classList.add("escuchando");
  r.onresult = (e) => { texto.value = [...e.results].map((x) => x[0].transcript).join(""); ajustar(); };
  r.onend = () => { $("#microfono").classList.remove("escuchando"); if (texto.value.trim()) mandar(); };
  r.onerror = () => msgError("No pude usar el micrófono. Revisa que el navegador tenga permiso para usarlo.");
  r.start();
};

/* ---------- Hablar con Isa ---------- */
function setOcupado(si) { ocupado = si; enviarBtn.disabled = si; $("#parar").hidden = !si; if (!si) estadoIsa("", ""); }
const agenteDe = (id) => equipo.agentes.find((x) => x.id === id) || { nombre: id, color: "#9fb6dc" };

async function mandar() {
  const mensaje = texto.value.trim(); if (!mensaje || ocupado) return;
  texto.value = ""; ajustar(); if ("speechSynthesis" in window) speechSynthesis.cancel();
  msgYo(mensaje); historial.push({ de: "yo", texto: mensaje }); guardar();
  setOcupado(true); estadoIsa("pensando", "Pensando…");
  abrirMision(mensaje.length > 70 ? mensaje.slice(0, 68) + "…" : mensaje);
  bitacora(`<b style="color:var(--celeste)">Isa</b> recibió tu pedido`);
  let caja = null, acumulado = "";
  const cerrarCaja = () => {
    caja?.classList.remove("escribiendo");
    const t = acumulado.trim();
    if (t) { historial.push({ de: "isa", texto: t }); const rs = rutasEn(t);
             rs.forEach((r, i) => agregarResultado(r, i === 0)); if (rs[0]) aparicion(rs[0]); hablar(t); }
    caja = null; acumulado = ""; guardar();
  };
  try {
    const r = await fetch("/api/conversar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mensaje, sesion }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || "Isa no respondió. Vuelve a intentarlo."); }
    const lector = r.body.getReader(), dec = new TextDecoder(); let resto = "";
    while (true) {
      const { value, done } = await lector.read(); if (done) break;
      resto += dec.decode(value, { stream: true });
      const partes = resto.split("\n"); resto = partes.pop();
      for (const l of partes) {
        if (!l.trim()) continue; const ev = JSON.parse(l);
        if (ev.tipo === "sesion" && ev.sesion) { sesion = ev.sesion; guardar(); }
        else if (ev.tipo === "corte") cerrarCaja();
        else if (ev.tipo === "texto") {
          if (!caja) { caja = msgIsa(""); caja.classList.add("escribiendo"); }
          acumulado += ev.texto; caja.innerHTML = formatear(acumulado); bajar();
          estadoIsa(misionActiva.size ? "pensando" : "hablando", misionActiva.size ? "Coordinando al equipo" : "Respondiendo…");
        } else if (ev.tipo === "agente_empieza") {
          cerrarCaja(); const a = agenteDe(ev.agente); misionActiva.add(ev.agente);
          evento(eventoHtml(a.color, "→", `Isa llamó a <b>${esc(a.nombre)}</b>${ev.tarea ? ` <span class="h">· ${esc(ev.tarea)}</span>` : ""}`));
          abrirMision(ev.tarea || null); bitacora(`<b style="color:${a.color}">${esc(a.nombre)}</b> va a la mesa`);
          of("convocar", ev.agente); of("reunion", true); estadoIsa("pensando", `Coordinando a ${a.nombre}`);
        } else if (ev.tipo === "agente_hace") {
          const a = agenteDe(ev.agente); of("actividad", ev.agente, ev.texto); bitacora(`<b style="color:${a.color}">${esc(a.nombre)}</b> · ${esc(ev.texto)}`);
        } else if (ev.tipo === "isa_hace") { estadoIsa("pensando", ev.texto); bitacora(`<b style="color:var(--celeste)">Isa</b> · ${esc(ev.texto)}`); }
        else if (ev.tipo === "agente_termina") {
          const a = agenteDe(ev.agente); misionActiva.delete(ev.agente); of("liberar", ev.agente);
          evento(eventoHtml(a.color, "✓", `<b>${esc(a.nombre)}</b> terminó <span class="h">· ${hora()}</span>`));
          bitacora(`<b style="color:${a.color}">${esc(a.nombre)}</b> terminó ✓`);
          estadoIsa("pensando", "Revisando resultados…"); cargarTrabajos();
        } else if (ev.tipo === "error") { cerrarCaja(); msgError(ev.texto); }
      }
    }
  } catch (e) { msgError(e.message || "Se cortó la conexión. Revisa que la ventana del panel siga abierta."); }
  cerrarCaja(); misionActiva.forEach((id) => of("liberar", id)); misionActiva.clear();
  bitacora(`<b style="color:var(--bien)">Misión completa</b>`); setOcupado(false); cerrarMision(); cargarTrabajos(); cargarEquipo();
}

function ajustar() { texto.style.height = "auto"; texto.style.height = Math.min(texto.scrollHeight, 150) + "px"; }
texto.addEventListener("input", ajustar);
texto.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mandar(); } });
$("#formulario").onsubmit = (e) => { e.preventDefault(); mandar(); };
$("#parar").onclick = () => fetch("/api/parar", { method: "POST" });
$("#nueva").onclick = () => { if (ocupado) return; sesion = null; historial = []; resultados = []; guardar(); saludo(); pintarArchivo(); };

cargarEquipo().then(() => { pintarHistorial(); guardar(); });
cargarTrabajos();
setInterval(() => { if (!ocupado) { cargarEquipo(); cargarTrabajos(); } }, 15000);
</script>
</body>
</html>
