<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agentes en HubSpot</title>
<style>
@font-face{font-family:Lexend;src:url(fonts/lexend.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#071229;font-family:Lexend,sans-serif;color:#1d2b3a}
.a{position:absolute}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1400px 900px at 50% 35%,#10285a 0%,#0a1a3c 45%,#061026 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(110px)}
#dots{position:absolute;inset:-40px;background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.3px);background-size:36px 36px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}
.hero{position:absolute;left:0;right:0;text-align:center;color:#fff}
.logocard{position:absolute;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.eyebrow{font-size:20px;letter-spacing:.28em;color:#8fb3ff;font-weight:500}

/* hub */
.node{position:absolute;width:250px;text-align:center;color:#fff}
.nic{width:96px;height:96px;border-radius:28px;margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.nl{font-size:22px;font-weight:600;margin-top:18px}
.nd{font-size:16px;color:#a9bde0;margin-top:4px;font-weight:300}
.core{position:absolute;left:860px;top:440px;width:200px;height:200px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,255,255,.06),0 0 0 30px rgba(255,255,255,.03),0 30px 80px rgba(0,0,0,.4)}

/* títulos de escena */
.stitle{position:absolute;left:140px;top:44px;color:#fff;transform-origin:0 0;white-space:nowrap}
.snum{font-size:20px;font-weight:600;padding:6px 14px;border-radius:12px;margin-right:16px;vertical-align:6px}
.sname{font-size:40px;font-weight:600;letter-spacing:-.01em}
.ssub{font-size:20px;color:#a9bde0;font-weight:300;margin-top:6px;margin-left:2px}

/* ventana hubspot */
.win{position:absolute;left:140px;top:150px;width:1640px;height:890px;background:#f4f7fb;border-radius:22px;overflow:hidden;box-shadow:0 50px 120px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
.chrome{position:absolute;left:0;right:0;top:0;height:50px;background:#2e3f50;display:flex;align-items:center;padding:0 20px;gap:16px;color:#e8eef5;font-size:15px}
.srch{width:420px;height:32px;border-radius:16px;border:1.5px solid #6d87a3;display:flex;align-items:center;padding:0 14px;color:#c9d5e2;font-size:14px}
.whead{position:absolute;left:28px;right:28px;top:66px;height:84px;display:flex;align-items:center;gap:18px}
.aico{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.wn{font-size:28px;font-weight:600;color:#1d2b3a}
.ws{font-size:15px;color:#7d93ad;margin-top:2px}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;padding:10px 18px;border-radius:22px;background:#e9f6ef;color:#1f8a57}
.pd{width:10px;height:10px;border-radius:50%;background:#2fb36b}
.col{position:absolute;top:166px;bottom:28px}
.pc{background:#fff;border:1px solid #e1e7ef;border-radius:18px;position:absolute;left:0;right:0;overflow:hidden}
.pl{font-size:14px;font-weight:600;letter-spacing:.08em;color:#7d93ad;text-transform:uppercase;position:absolute;left:22px;top:20px}
.li{position:absolute;left:16px;right:16px;height:64px;border-radius:14px;display:flex;align-items:center;gap:14px;padding:0 14px}
.lav{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;flex:none}
.ln{font-size:16px;font-weight:600;color:#1d2b3a}
.lsub{font-size:13px;color:#7d93ad;margin-top:2px}
.lst{margin-left:auto;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.spin{width:16px;height:16px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px)}
.ok{width:20px;height:20px;border-radius:50%;background:#2fb36b;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
.mt{position:absolute;left:0;right:0;height:150px;background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:22px 24px}
.mv{font-size:46px;font-weight:600;color:#1d2b3a;letter-spacing:-.02em;margin-top:8px}
.ml{font-size:15px;color:#7d93ad}
.mdelta{position:absolute;right:22px;top:22px;font-size:14px;font-weight:600;color:#1f8a57;background:#e9f6ef;padding:4px 10px;border-radius:10px}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 9px;border-radius:9px;background:#eef3f9;color:#4a6584;margin-right:6px}
.caret{display:inline-block;width:2px;height:20px;background:#1d2b3a;vertical-align:-4px;margin-left:1px}
.bub{position:absolute;max-width:470px;font-size:17px;line-height:1.5;padding:14px 18px}
.cu{right:22px;background:#2450a0;color:#fff;border-radius:18px 18px 4px 18px}
.ag{left:22px;background:#f1f5fa;color:#1d2b3a;border-radius:18px 18px 18px 4px}
.tdots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7d93ad;margin-right:5px}
.th{position:absolute;left:22px;right:22px;height:46px;display:flex;align-items:center;font-size:14px;border-bottom:1px solid #edf1f6}
.cell{flex:1;padding:0 8px;white-space:nowrap;overflow:hidden;position:relative;height:30px;display:flex;align-items:center}
.fill{position:absolute;left:4px;right:8px;top:2px;bottom:2px;border-radius:8px}
.kcol{position:absolute;top:60px;bottom:16px;width:146px;border-radius:14px;background:#f4f7fb}
.kh{font-size:13px;font-weight:600;color:#4a6584;padding:12px 12px 0;display:flex;justify-content:space-between}
.kc{position:absolute;width:132px;height:96px;background:#fff;border-radius:12px;border:1px solid #e1e7ef;box-shadow:0 4px 12px rgba(29,43,58,.06);padding:10px 12px;font-size:13px}
.kc b{display:block;font-size:14px;font-weight:600;color:#1d2b3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc i{font-style:normal;color:#7d93ad;font-size:12px}
.kc em{font-style:normal;display:block;font-size:16px;font-weight:600;margin-top:8px;color:#1d2b3a}
.alert{position:absolute;left:16px;right:16px;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.4;display:flex;gap:12px;align-items:flex-start}
.dotc{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
#fade{position:absolute;inset:0;background:#061026;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gOr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f59"/><stop offset="1" stop-color="#ff4f3a"/></linearGradient></defs></svg>
<div id="stage">
  <div class="glow" id="g1" style="width:900px;height:900px;background:#2450a0;opacity:.45"></div>
  <div class="glow" id="g2" style="width:700px;height:700px;background:#10b5e0;opacity:.16"></div>
  <div class="glow" id="g3" style="width:600px;height:600px;background:#7cb83a;opacity:.10"></div>
  <div id="dots"></div>

  <!-- INTRO -->
  <div id="intro" class="a" style="inset:0">
    <div class="logocard" id="ilogo" style="left:800px;top:250px;width:320px;height:126px"><img src="assets/logo-ficensa.webp" style="width:262px"></div>
    <div class="hero eyebrow" id="ieye" style="top:440px">BANCO FICENSA · HUBSPOT</div>
    <div class="hero" id="it1" style="top:490px;font-size:88px;font-weight:600;letter-spacing:-.03em">Agentes de IA</div>
    <div class="hero" id="it2" style="top:600px;font-size:44px;font-weight:300;color:#cfe0ff">que trabajan dentro de nuestro CRM</div>
    <div class="a" id="iline" style="left:810px;top:690px;width:300px;height:2px;background:linear-gradient(90deg,transparent,#8fb3ff,transparent)"></div>
  </div>

  <!-- HUB -->
  <div id="hub" class="a" style="inset:0">
    <div class="hero" id="htitle" style="top:70px"><div class="eyebrow">UN EQUIPO DIGITAL, 24/7</div><div style="font-size:50px;font-weight:600;margin-top:14px;letter-spacing:-.02em">Cuatro agentes, un mismo CRM</div></div>
    <svg class="a" id="hlines" width="1920" height="1080" style="left:0;top:0"></svg>
    <div class="core" id="hcore"><div id="hcorespk"></div><div style="font-size:17px;font-weight:600;color:#2e3f50;margin-top:8px">HubSpot</div><div style="font-size:13px;color:#7d93ad">Breeze</div></div>
  </div>

  <div id="scenes"></div>

  <!-- OUTRO -->
  <div id="outro" class="a" style="inset:0">
    <div class="hero" id="ot1" style="top:150px;font-size:56px;font-weight:600;letter-spacing:-.02em">Más tiempo para lo que importa:</div>
    <div class="hero" id="ot2" style="top:226px;font-size:56px;font-weight:300;color:#cfe0ff">nuestros clientes.</div>
    <div id="orow"></div>
    <div class="logocard" id="ologo" style="left:790px;top:720px;width:340px;height:134px"><img src="assets/logo-ficensa.webp" style="width:280px"></div>
    <div class="hero" id="osub" style="top:884px;font-size:18px;color:#a9bde0;letter-spacing:.06em">AGENTES DE IA CON HUBSPOT BREEZE</div>
    <div class="hero" id="onote" style="top:1022px;font-size:14px;color:#5f7aa6;letter-spacing:.1em">SIMULACIÓN CONCEPTUAL · DATOS DE EJEMPLO</div>
  </div>
  <div id="fade"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const esoft=x=>1-Math.pow(1-x,4);
const eback=x=>{const c1=1.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const fmt=n=>Math.round(n).toLocaleString('en-US');
function S(el,o){ if(typeof el==='string') el=$(el); if(!el) return;
  const x=o.x||0,y=o.y||0,s=o.s===undefined?1:o.s;
  el.style.transform=`translate(${x}px,${y}px) scale(${s})`;
  if(o.o!==undefined){el.style.opacity=o.o;el.style.visibility=o.o<=0.001?'hidden':'visible'}
  if(o.b!==undefined) el.style.filter=o.b>0.05?`blur(${o.b}px)`:'none';
}
const io=(t,a,b,c,d)=>Math.min(esoft(P(t,a,b)), d===undefined?1:1-eio(P(t,c,d)));
const CUES=[]; const cue=(t,type,v={})=>CUES.push(Object.assign({t:+t.toFixed(3),type},v));
const SPK=s=>`<svg width="${s}" height="${s}" viewBox="0 0 120 120"><path d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z" fill="url(#gOr)" transform="translate(4,14) scale(.92)"/><path d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z" fill="url(#gOr)" transform="translate(84,2) scale(.3)"/></svg>`;
$('hcorespk').innerHTML=SPK(64);

/* ---------- agentes ---------- */
const GL={ // glifos blancos
 pros:`<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="15" cy="15" r="9"/><path d="M22 22l7 7"/><circle cx="15" cy="15" r="3" fill="#fff"/></svg>`,
 aten:`<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"><path d="M5 7h24v15H14l-6 5v-5H5z"/><path d="M11 13h12M11 17h8" stroke-linecap="round"/></svg>`,
 dato:`<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2.6"><ellipse cx="17" cy="8" rx="10" ry="4"/><path d="M7 8v18c0 2.2 4.5 4 10 4s10-1.8 10-4V8M7 17c0 2.2 4.5 4 10 4s10-1.8 10-4"/></svg>`,
 nego:`<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 27h24"/><path d="M7 21l7-7 5 5 9-10"/><path d="M22 9h6v6"/></svg>`,
};
const AG=[
 {k:'pros',c:'#2450a0',n:'Agente de prospección',d:'Investiga, personaliza y agenda',sub:'Investiga empresas, redacta mensajes personalizados y agenda reuniones'},
 {k:'aten',c:'#0ea5d6',n:'Agente de atención al cliente',d:'Responde 24/7 en todos los canales',sub:'Responde con la base de conocimiento del banco y escala cuando hace falta'},
 {k:'dato',c:'#6aa832',n:'Agente de calidad de datos',d:'Limpia, completa y unifica',sub:'Detecta duplicados, completa campos y mantiene el CRM confiable'},
 {k:'nego',c:'#e0a500',n:'Agente de negocios',d:'Pronostica y prioriza el pipeline',sub:'Mueve el pipeline, detecta riesgos y recomienda la siguiente acción'},
];

const short=n=>{const x=n.replace('Agente de ','');return x[0].toUpperCase()+x.slice(1)};
/* ---------- tiempos ---------- */
const TL={intro:[0,5.6],hub:[5.0,12.2]};
const SCN=[[11.6,23.8],[23.2,35.4],[34.8,47.0],[46.4,58.6]];
const OUT=58.0, DURATION=67.5;
window.DURATION=DURATION;

/* ---------- hub: nodos ---------- */
const HN=[[300,170],[1370,170],[300,740],[1370,740]]; // posiciones (izq, top) de cada nodo
let hl='';
AG.forEach((a,i)=>{
  const n=document.createElement('div'); n.className='node'; n.id='hn'+i;
  n.style.left=HN[i][0]+'px'; n.style.top=(HN[i][1]+60)+'px';
  n.innerHTML=`<div class="nic" style="background:${a.c}">${GL[a.k]}</div><div class="nl">${short(a.n)}</div><div class="nd">${a.d}</div>`;
  $('hub').appendChild(n);
  const x1=HN[i][0]+125, y1=HN[i][1]+60+48;
  hl+=`<path id="hp${i}" d="M960 540 L${x1} ${y1}" stroke="rgba(143,179,255,.45)" stroke-width="2" fill="none" stroke-dasharray="4 8"/><circle id="hd${i}" r="5" fill="${a.c}"/>`;
});
$('hlines').innerHTML=hl;

/* ---------- ventanas de agentes ---------- */
function win(i,body){
  const a=AG[i];
  return `<div class="stitle" id="st${i}"><span class="snum" style="background:${a.c}">0${i+1}</span><span class="sname">${a.n}</span><div class="ssub">${a.sub}</div></div>
  <div class="win" id="w${i}">
    <div class="chrome"><svg width="26" height="26" viewBox="0 0 30 30"><circle cx="15" cy="15" r="7" fill="none" stroke="#ff7a59" stroke-width="4"/><circle cx="15" cy="4" r="3" fill="#ff7a59"/><circle cx="25" cy="21" r="3" fill="#ff7a59"/><circle cx="5" cy="21" r="3" fill="#ff7a59"/></svg>
      <div class="srch">Buscar en HubSpot</div><span style="display:flex;align-items:center;gap:6px">${SPK(18)} Breeze Agents</span><div style="flex:1"></div>
      <div style="width:28px;height:28px;border-radius:7px;background:#fff;overflow:hidden;position:relative"><img src="assets/logo-ficensa.webp" style="position:absolute;height:26px;left:2px;top:1px"></div><b style="font-weight:600">Banco Ficensa</b></div>
    <div class="whead"><div class="aico" style="background:${a.c}">${GL[a.k]}</div><div><div class="wn">${a.n}</div><div class="ws">Breeze Agents · HubSpot · Banco Ficensa</div></div>
      <div class="status" id="ss${i}"><span class="pd" id="sp${i}"></span><span id="stx${i}">Trabajando</span></div></div>
    ${body}
  </div>`;
}
const SC=$('scenes');
function addScene(i,body){const d=document.createElement('div');d.className='a';d.id='sc'+i;d.style.inset='0';d.innerHTML=win(i,body);SC.appendChild(d)}

// ---- 1: prospección ----
const COMP=[['Agroexport del Valle','Exportación agrícola','AV','#e0a500',['Exportador','350 empleados']],
 ['Constructora Atlas','Construcción','CA','#2450a0',['Proyecto nuevo','Crecimiento 22%']],
 ['Textiles Norteños','Manufactura','TN','#c2477a',['Expansión','2 plantas']],
 ['Café Montaña','Café de especialidad','CM','#6aa832',['Exportador','Certificación']],
 ['Logística Istmo','Transporte','LI','#0ea5d6',['Flota nueva','Regional']],
 ['Farmacéutica Sol','Salud','FS','#7a5cc7',['Importador','B2B']]];
const EMAIL='Hola María, vi que Agroexport del Valle amplió sus exportaciones a Centroamérica este año. En Banco Ficensa tenemos líneas de financiamiento para comercio exterior que pueden acompañar ese crecimiento. ¿Le parece si conversamos 20 minutos el jueves?';
addScene(0,`
 <div class="col" style="left:28px;width:440px"><div class="pc" style="top:0;bottom:0"><div class="pl">Empresas objetivo</div>
  ${COMP.map((c,j)=>`<div class="li" id="p0r${j}" style="top:${60+j*104}px;height:92px;background:#f8fafc"><div class="lav" style="background:${c[3]}">${c[2]}</div>
   <div style="min-width:0"><div class="ln">${c[0]}</div><div class="lsub">${c[1]}</div><div id="p0g${j}" style="margin-top:6px">${c[4].map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>
   <div class="lst" id="p0s${j}"></div></div>`).join('')}
 </div></div>
 <div class="col" style="left:492px;width:640px"><div class="pc" id="p0mail" style="top:0;bottom:0">
  <div class="pl">Correo personalizado · borrador del agente</div>
  <div class="a" style="left:22px;right:22px;top:62px;font-size:15px;color:#4a6584;line-height:2.2">
   <div style="border-bottom:1px solid #edf1f6"><span style="color:#9aaec4">Para:</span> María López · Gerente financiera, Agroexport del Valle</div>
   <div style="border-bottom:1px solid #edf1f6"><span style="color:#9aaec4">Asunto:</span> <b style="color:#1d2b3a;font-weight:600">Financiamiento para su expansión regional</b></div></div>
  <div class="a" id="p0body" style="left:22px;right:22px;top:170px;font-size:19px;line-height:1.65;color:#1d2b3a"></div>
  <div class="a" id="p0why" style="left:22px;right:22px;top:470px;border-radius:14px;background:#eef3fb;padding:14px 16px;font-size:14px;color:#2450a0;line-height:1.5">
   ${SPK(16)} <b style="font-weight:600">Por qué este mensaje:</b> noticia de expansión regional + visitas a la página de comercio exterior esta semana.</div>
  <div class="a" style="left:22px;right:22px;bottom:22px;display:flex;gap:12px;align-items:center">
   <span class="tag">Tono: profesional</span><span class="tag">Personalización alta</span><div style="flex:1"></div>
   <div id="p0btn" style="background:#2450a0;color:#fff;font-size:16px;font-weight:600;padding:12px 22px;border-radius:12px">Enviar y agendar</div></div>
 </div></div>
 <div class="col" style="left:1156px;width:456px">
  <div class="mt" id="p0m0" style="top:0"><div class="ml">Empresas investigadas</div><div class="mv" id="p0v0">0</div><div class="mdelta">hoy</div></div>
  <div class="mt" id="p0m1" style="top:170px"><div class="ml">Correos personalizados</div><div class="mv" id="p0v1">0</div><div class="mdelta">41% apertura</div></div>
  <div class="mt" id="p0m2" style="top:340px"><div class="ml">Reuniones agendadas</div><div class="mv" id="p0v2">0</div><div class="mdelta" id="p0d2">+1</div></div>
  <div class="pc" id="p0m3" style="top:510px;bottom:0"><div class="pl">Próxima reunión</div>
   <div class="a" style="left:22px;right:22px;top:58px;display:flex;gap:14px;align-items:center"><div style="width:58px;height:62px;border-radius:12px;background:#eef3fb;text-align:center;color:#2450a0"><div style="font-size:12px;font-weight:600;margin-top:8px">JUE</div><div style="font-size:24px;font-weight:600">14</div></div>
   <div><div class="ln">Agroexport del Valle</div><div class="lsub">10:00 · Videollamada · 20 min</div></div></div></div>
 </div>`);

// ---- 2: atención ----
const CH=[['WhatsApp','Consulta de tarjeta','#25a35a'],['Chat web','Apertura de cuenta','#0ea5d6'],['Correo','Estado de préstamo','#2450a0'],['WhatsApp','Cambio de PIN','#25a35a'],['Chat web','Horario de agencias','#0ea5d6'],['Correo','Constancia de saldo','#2450a0']];
addScene(1,`
 <div class="col" style="left:28px;width:440px"><div class="pc" style="top:0;bottom:0"><div class="pl">Conversaciones en curso</div>
